<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RESTARAN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#09090b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    min-height:100vh;
    padding:16px;
}

.hidden{
    display:none!important;
}

/* =========================
   LOADING
========================= */

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#09090b;
}

.loaderBox{
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:20px;
}

.loader{
    width:38px;
    height:38px;
    border:4px solid #29292e;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginCard{
    width:100%;
    max-width:430px;
    background:#111114;
    border:1px solid #27272c;
    border-radius:26px;
    padding:28px;
    box-shadow:0 20px 70px #000;
}

.loginTitle{
    font-size:30px;
    font-weight:900;
    margin-bottom:7px;
}

.loginSubtitle{
    color:#8b8b94;
    margin-bottom:25px;
}

.input{
    width:100%;
    height:54px;
    background:#19191e;
    border:1px solid #303038;
    border-radius:15px;
    color:#fff;
    padding:0 16px;
    outline:none;
    margin-bottom:12px;
}

.input:focus{
    border-color:#77777f;
}

.primary{
    width:100%;
    min-height:52px;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-weight:800;
}

.danger{
    background:#35171b!important;
    color:#ff707b!important;
    border:1px solid #61252d!important;
}

.secondary{
    background:#1b1b20;
    color:#fff;
    border:1px solid #303038;
}

/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
}

.headerTitle{
    font-size:25px;
    font-weight:900;
}

.headerSub{
    color:#81818b;
    font-size:13px;
    margin-top:3px;
}

.iconButton{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#17171b;
    color:#fff;
    border:1px solid #2a2a30;
}

/* =========================
   CARDS
========================= */

.card{
    background:#111114;
    border:1px solid #25252b;
    border-radius:20px;
    padding:17px;
    margin-bottom:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:#17171b;
    border:1px solid #292930;
    border-radius:17px;
    padding:15px;
}

.statValue{
    font-size:25px;
    font-weight:900;
}

.statName{
    color:#80808a;
    font-size:12px;
    margin-top:4px;
}

/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:15px;
}

.tab{
    flex:none;
    padding:11px 14px;
    border-radius:13px;
    background:#151519;
    color:#8d8d97;
    border:1px solid #292930;
    font-weight:700;
}

.tab.active{
    background:#fff;
    color:#000;
}

/* =========================
   ORDER
========================= */

.order{
    background:#16161a;
    border:1px solid #292930;
    border-radius:17px;
    padding:15px;
    margin-bottom:10px;
}

.orderTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.orderTitle{
    font-weight:800;
}

.status{
    font-size:11px;
    padding:6px 9px;
    border-radius:9px;
    background:#24242a;
    white-space:nowrap;
}

.muted{
    color:#85858f;
}

.small{
    font-size:12px;
}

/* =========================
   CUSTOMER
========================= */

.customer{
    background:#16161a;
    border:1px solid #292930;
    border-radius:18px;
    padding:15px;
    margin-bottom:10px;
}

.customerName{
    font-weight:900;
    font-size:17px;
    margin-bottom:5px;
}

.customerInfo{
    color:#8c8c96;
    font-size:13px;
    line-height:1.7;
}

.customerActions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.customerActions button{
    flex:1;
    min-height:43px;
    border-radius:12px;
    background:#222228;
    color:#fff;
    border:1px solid #303038;
    font-weight:700;
}

/* =========================
   FORMS
========================= */

.formGrid{
    display:grid;
    gap:10px;
}

.formTitle{
    font-weight:900;
    font-size:18px;
    margin-bottom:12px;
}

.formButton{
    width:100%;
    min-height:48px;
    border-radius:14px;
    background:#fff;
    color:#000;
    font-weight:800;
}

/* =========================
   ERROR
========================= */

#errorBox{
    margin-top:12px;
    color:#ff737d;
    font-size:13px;
    line-height:1.5;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#fff;
    color:#000;
    padding:12px 18px;
    border-radius:14px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100000;
    max-width:90%;
    text-align:center;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    z-index:5000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.modalBox{
    width:100%;
    max-width:600px;
    background:#111114;
    border:1px solid #2b2b31;
    border-radius:25px 25px 0 0;
    padding:20px;
    max-height:90vh;
    overflow:auto;
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modalTitle{
    font-size:20px;
    font-weight:900;
}
</style>
</head>

<body>

<div id="loadingScreen">
    <div class="loaderBox">
        <div class="logo">RESTARAN</div>
        <div class="loader"></div>
    </div>
</div>

<div id="loginScreen" class="hidden">
    <div class="loginCard">
        <div class="loginTitle">RESTARAN</div>
        <div class="loginSubtitle">Войдите в аккаунт</div>

        <input
            id="phoneInput"
            class="input"
            type="tel"
            placeholder="Номер телефона"
        >

        <input
            id="pinInput"
            class="input"
            type="password"
            inputmode="numeric"
            placeholder="PIN"
        >

        <button class="primary" onclick="login()">
            Войти
        </button>

        <div id="errorBox"></div>
    </div>
</div>

<div id="app" class="app hidden">

    <div class="header">
        <div>
            <div class="headerTitle">RESTARAN</div>
            <div id="roleText" class="headerSub"></div>
        </div>

        <button class="iconButton" onclick="logout()">
            ⎋
        </button>
    </div>

    <!-- ADMIN -->

    <section id="adminView" class="hidden">

        <div class="stats">
            <div class="stat">
                <div id="statOrders" class="statValue">0</div>
                <div class="statName">Заказы</div>
            </div>

            <div class="stat">
                <div id="statCustomers" class="statValue">0</div>
                <div class="statName">Клиенты</div>
            </div>

            <div class="stat">
                <div id="statCouriers" class="statValue">0</div>
                <div class="statName">Курьеры</div>
            </div>

            <div class="stat">
                <div id="statActive" class="statValue">0</div>
                <div class="statName">Активные</div>
            </div>
        </div>

        <br>

        <div class="tabs">
            <button class="tab active" onclick="adminTab('orders',this)">
                Заказы
            </button>

            <button class="tab" onclick="adminTab('customers',this)">
                Клиенты
            </button>

            <button class="tab" onclick="adminTab('couriers',this)">
                Курьеры
            </button>

            <button class="tab" onclick="adminTab('statistics',this)">
                Статистика
            </button>
        </div>

        <div id="adminOrdersArea"></div>
        <div id="adminCustomersArea" class="hidden"></div>
        <div id="adminCouriersArea" class="hidden"></div>
        <div id="adminStatsArea" class="hidden"></div>

    </section>

    <!-- CUSTOMER -->

    <section id="customerView" class="hidden">
        <div class="card">
            <div class="formTitle">Мои заказы</div>
            <div id="customerOrders"></div>
        </div>
    </section>

    <!-- COURIER -->

    <section id="courierView" class="hidden">
        <div class="card">
            <div class="formTitle">Курьер</div>

            <button
                id="courierOnlineButton"
                class="primary"
                onclick="toggleCourierOnline()">
                Выйти на линию
            </button>
        </div>

        <div class="card">
            <div class="formTitle">Мои заказы</div>
            <div id="courierOrders"></div>
        </div>
    </section>

</div>

<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

/*
=========================================================
ВАЖНО:
АДМИН ПРОВЕРЯЕТСЯ ДО ПОКАЗА LOGIN SCREEN.
=========================================================
*/

const ADMIN_IDS = new Set([
    "8357023784",
    "7003441441"
]);

let authToken = null;
let currentRole = null;
let currentUser = null;

function telegramId(){
    const id = tg?.initDataUnsafe?.user?.id;
    return id ? String(id) : null;
}

function isAdminTelegram(){
    const id = telegramId();
    return !!id && ADMIN_IDS.has(id);
}

function show(id){
    document.getElementById(id)?.classList.remove("hidden");
}

function hide(id){
    document.getElementById(id)?.classList.add("hidden");
}

function toast(text){
    const el = document.getElementById("toast");

    el.textContent = text;
    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },2500);
}

function formatError(error){
    if(!error) return "Неизвестная ошибка";

    if(typeof error === "string") return error;

    if(error.message) return error.message;

    try{
        return JSON.stringify(error);
    }catch{
        return "Ошибка";
    }
}

async function api(url,options={}){
    const headers = {
        ...(options.headers || {})
    };

    if(authToken){
        headers.Authorization = "Bearer " + authToken;
    }

    if(
        options.body &&
        typeof options.body !== "string"
    ){
        headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(options.body);
    }

    const response = await fetch(url,{
        ...options,
        headers
    });

    let data = null;

    try{
        data = await response.json();
    }catch{
        data = null;
    }

    if(!response.ok){
        throw new Error(
            data?.detail ||
            data?.message ||
            "Ошибка сервера"
        );
    }

    return data;
}

/*
=========================================================
ADMIN AUTO LOGIN
НИКАКОГО PHONE/PIN ДЛЯ АДМИНА
=========================================================
*/

async function adminAutoLogin(){

    if(!isAdminTelegram()){
        return false;
    }

    /*
    Старый токен специально игнорируем.
    Админ каждый раз авторизуется через Telegram initData.
    */

    localStorage.removeItem("restaran_token");

    if(!tg){
        throw new Error(
            "Откройте RESTARAN через Telegram"
        );
    }

    if(!tg.initData){
        throw new Error(
            "Telegram initData отсутствует. Откройте Web App через Telegram."
        );
    }

    const result = await api(
        "/api/admin/web-login",
        {
            method:"POST",
            body:{
                init_data:tg.initData
            }
        }
    );

    if(!result?.token){
        throw new Error(
            "Сервер не выдал токен администратора"
        );
    }

    authToken = result.token;
    currentRole = "admin";
    currentUser = result.user || null;

    localStorage.setItem(
        "restaran_token",
        authToken
    );

    return true;
}

/*
=========================================================
BOOT
=========================================================
*/

async function boot(){

    hide("loginScreen");
    hide("app");

    try{

        /*
        ПЕРВАЯ ПРОВЕРКА — АДМИН.
        Поэтому LOGIN НИКОГДА НЕ ПОЯВИТСЯ АДМИНУ.
        */

        if(isAdminTelegram()){

            await adminAutoLogin();

            show("app");
            show("adminView");

            document.getElementById("roleText").textContent =
                "Администратор";

            hide("loadingScreen");

            await loadAdmin();

            return;
        }

        /*
        Обычные пользователи могут использовать сохранённую
        сессию.
        */

        const saved =
            localStorage.getItem("restaran_token");

        if(saved){

            try{

                authToken = saved;

                const me = await api(
                    "/api/me"
                );

                currentRole = me.role;
                currentUser = me.user;

                hide("loadingScreen");
                showAppByRole();

                return;

            }catch{

                localStorage.removeItem(
                    "restaran_token"
                );

                authToken = null;
            }
        }

        hide("loadingScreen");
        show("loginScreen");

    }catch(error){

        hide("loadingScreen");

        /*
        Даже если adminAutoLogin упал,
        LOGIN НЕ ПОКАЗЫВАЕМ АДМИНУ.
        */

        if(isAdminTelegram()){

            show("loginScreen");

            document.getElementById(
                "errorBox"
            ).textContent =
                formatError(error);

            /*
            Повторная попытка.
            */

            setTimeout(async()=>{
                try{

                    await adminAutoLogin();

                    hide("loginScreen");
                    show("app");
                    show("adminView");

                    document.getElementById(
                        "roleText"
                    ).textContent =
                        "Администратор";

                    await loadAdmin();

                }catch(e){

                    document.getElementById(
                        "errorBox"
                    ).textContent =
                        formatError(e);
                }
            },1500);

            return;
        }

        show("loginScreen");

        document.getElementById(
            "errorBox"
        ).textContent =
            formatError(error);
    }
}

function showAppByRole(){

    hide("loginScreen");
    show("app");

    hide("adminView");
    hide("customerView");
    hide("courierView");

    if(currentRole === "admin"){
        show("adminView");
        document.getElementById("roleText").textContent =
            "Администратор";
    }

    if(currentRole === "customer"){
        show("customerView");
        document.getElementById("roleText").textContent =
            "Клиент";

        loadCustomerOrders();
    }

    if(currentRole === "courier"){
        show("courierView");
        document.getElementById("roleText").textContent =
            "Курьер";

        loadCourierOrders();
    }
}

/*
=========================================================
LOGIN
=========================================================
*/

async function login(){

    /*
    НОВАЯ ЗАЩИТА:
    если это админ — login вообще не выполняется.
    */

    if(isAdminTelegram()){

        try{

            await adminAutoLogin();

            showAppByRole();
            await loadAdmin();

        }catch(error){

            toast(
                "Ошибка админ-входа: " +
                formatError(error)
            );
        }

        return;
    }

    const phone =
        document.getElementById(
            "phoneInput"
        ).value.trim();

    const pin =
        document.getElementById(
            "pinInput"
        ).value.trim();

    if(!phone || !pin){

        document.getElementById(
            "errorBox"
        ).textContent =
            "Введите номер телефона и PIN";

        return;
    }

    try{

        const result = await api(
            "/api/login",
            {
                method:"POST",
                body:{
                    phone,
                    pin
                }
            }
        );

        authToken = result.token;
        currentRole = result.role;
        currentUser = result.user;

        localStorage.setItem(
            "restaran_token",
            authToken
        );

        showAppByRole();

    }catch(error){

        document.getElementById(
            "errorBox"
        ).textContent =
            formatError(error);
    }
}

function logout(){

    /*
    Админа НЕ отправляем на login.
    */

    if(isAdminTelegram()){

        adminAutoLogin()
            .then(()=>{
                showAppByRole();
                loadAdmin();
            })
            .catch(e=>{
                toast(formatError(e));
            });

        return;
    }

    localStorage.removeItem(
        "restaran_token"
    );

    authToken = null;
    currentRole = null;

    hide("app");
    show("loginScreen");
}

/*
=========================================================
ADMIN
=========================================================
*/

async function loadAdmin(){

    await loadAdminStats();
    await loadAdminOrders();
    await loadAdminCustomers();
    await loadAdminCouriers();
}

async function loadAdminStats(){

    try{

        const data = await api(
            "/api/admin/stats"
        );

        document.getElementById(
            "statOrders"
        ).textContent =
            data.orders ?? 0;

        document.getElementById(
            "statCustomers"
        ).textContent =
            data.customers ?? 0;

        document.getElementById(
            "statCouriers"
        ).textContent =
            data.couriers ?? 0;

        document.getElementById(
            "statActive"
        ).textContent =
            data.active_orders ?? 0;

    }catch(error){

        toast(formatError(error));
    }
}

function adminTab(name,button){

    document.querySelectorAll(
        ".tabs .tab"
    ).forEach(x=>{
        x.classList.remove("active");
    });

    button.classList.add("active");

    hide("adminOrdersArea");
    hide("adminCustomersArea");
    hide("adminCouriersArea");
    hide("adminStatsArea");

    if(name === "orders"){
        show("adminOrdersArea");
        loadAdminOrders();
    }

    if(name === "customers"){
        show("adminCustomersArea");
        loadAdminCustomers();
    }

    if(name === "couriers"){
        show("adminCouriersArea");
        loadAdminCouriers();
    }

    if(name === "statistics"){
        show("adminStatsArea");
        loadAdminStatsPage();
    }
}

async function loadAdminOrders(){

    const area =
        document.getElementById(
            "adminOrdersArea"
        );

    if(!area) return;

    try{

        const orders =
            await api("/api/admin/orders");

        area.innerHTML = `
            <div class="card">
                <div class="formTitle">
                    Все заказы
                </div>

                ${
                    orders.length
                    ? orders.map(renderAdminOrder).join("")
                    : '<div class="muted">Заказов нет</div>'
                }
            </div>
        `;

    }catch(error){

        area.innerHTML =
            `<div class="card">${escapeHtml(
                formatError(error)
            )}</div>`;
    }
}

function renderAdminOrder(order){

    return `
        <div class="order">

            <div class="orderTop">

                <div>
                    <div class="orderTitle">
                        #${order.id}
                    </div>

                    <div class="small muted">
                        ${escapeHtml(
                            order.title || "Заказ"
                        )}
                    </div>
                </div>

                <div class="status">
                    ${escapeHtml(
                        order.status || "new"
                    )}
                </div>

            </div>

            <div class="small muted">
                Клиент:
                ${escapeHtml(
                    order.customer_name || "—"
                )}
            </div>

            <div class="small muted">
                Адрес:
                ${escapeHtml(
                    order.address || "—"
                )}
            </div>

            <div class="small">
                ${escapeHtml(
                    String(order.price ?? 0)
                )} ֏
            </div>
        </div>
    `;
}

/*
=========================================================
CUSTOMERS
=========================================================
*/

async function loadAdminCustomers(){

    const area =
        document.getElementById(
            "adminCustomersArea"
        );

    if(!area) return;

    try{

        const customers =
            await api("/api/admin/customers");

        area.innerHTML = `

            <div class="card">

                <div class="formTitle">
                    Создать клиента
                </div>

                <div class="formGrid">

                    <input
                        id="newCustomerName"
                        class="input"
                        placeholder="Имя клиента"
                    >

                    <input
                        id="newCustomerPhone"
                        class="input"
                        type="tel"
                        placeholder="Номер телефона"
                    >

                    <input
                        id="newCustomerPin"
                        class="input"
                        type="text"
                        inputmode="numeric"
                        maxlength="8"
                        placeholder="PIN клиента"
                    >

                    <button
                        class="formButton"
                        onclick="createCustomer()">
                        Создать клиента
                    </button>

                </div>

            </div>

            <div class="card">

                <div class="formTitle">
                    Клиенты
                </div>

                ${
                    customers.length
                    ? customers.map(renderCustomer).join("")
                    : '<div class="muted">Клиентов нет</div>'
                }

            </div>
        `;

    }catch(error){

        area.innerHTML =
            `<div class="card">${escapeHtml(
                formatError(error)
            )}</div>`;
    }
}

function renderCustomer(c){

    return `
        <div class="customer">

            <div class="customerName">
                ${escapeHtml(c.name || "Без имени")}
            </div>

            <div class="customerInfo">

                📱 ${escapeHtml(c.phone || "—")}<br>

                🔐 PIN:
                <b>
                    ${escapeHtml(
                        c.pin_plain || "—"
                    )}
                </b><br>

                🟢 Статус:
                ${c.active ? "Активен" : "Удалён"}

            </div>

            <div class="customerActions">

                <button
                    onclick="deleteCustomer(${Number(c.id)})"
                    class="danger">
                    🗑 Удалить аккаунт
                </button>

            </div>

        </div>
    `;
}

async function createCustomer(){

    const name =
        document.getElementById(
            "newCustomerName"
        )?.value.trim();

    const phone =
        document.getElementById(
            "newCustomerPhone"
        )?.value.trim();

    const pin =
        document.getElementById(
            "newCustomerPin"
        )?.value.trim();

    if(!name || !phone || !pin){

        toast(
            "Заполните имя, телефон и PIN"
        );

        return;
    }

    if(!/^\d{4,8}$/.test(pin)){

        toast(
            "PIN должен содержать 4–8 цифр"
        );

        return;
    }

    try{

        await api(
            "/api/admin/customers",
            {
                method:"POST",
                body:{
                    name,
                    phone,
                    pin
                }
            }
        );

        toast("Клиент создан");

        await loadAdminCustomers();
        await loadAdminStats();

    }catch(error){

        toast(formatError(error));
    }
}

async function deleteCustomer(id){

    if(!confirm(
        "Удалить аккаунт клиента?"
    )){
        return;
    }

    try{

        await api(
            `/api/admin/customers/${id}`,
            {
                method:"DELETE"
            }
        );

        toast("Аккаунт удалён");

        await loadAdminCustomers();
        await loadAdminStats();

    }catch(error){

        toast(formatError(error));
    }
}

async function loadAdminCouriers(){

    const area =
        document.getElementById(
            "adminCouriersArea"
        );

    if(!area) return;

    try{

        const couriers =
            await api("/api/admin/couriers");

        area.innerHTML = `
            <div class="card">

                <div class="formTitle">
                    Курьеры
                </div>

                ${
                    couriers.length
                    ? couriers.map(c=>`
                        <div class="customer">

                            <div class="customerName">
                                ${escapeHtml(
                                    c.name || "Курьер"
                                )}
                            </div>

                            <div class="customerInfo">
                                📱 ${escapeHtml(c.phone || "—")}<br>
                                ${
                                    c.online
                                    ? "🟢 Онлайн"
                                    : "⚫ Оффлайн"
                                }<br>
                                ${
                                    c.approved
                                    ? "✅ Одобрен"
                                    : "⏳ Ожидает"
                                }
                            </div>

                        </div>
                    `).join("")
                    : '<div class="muted">Курьеров нет</div>'
                }

            </div>
        `;

    }catch(error){

        area.innerHTML =
            `<div class="card">${escapeHtml(
                formatError(error)
            )}</div>`;
    }
}

async function loadAdminStatsPage(){

    const area =
        document.getElementById(
            "adminStatsArea"
        );

    if(!area) return;

    try{

        const data =
            await api("/api/admin/stats");

        area.innerHTML = `
            <div class="card">

                <div class="formTitle">
                    Статистика
                </div>

                <div class="customerInfo">

                    Всего заказов:
                    <b>${data.orders ?? 0}</b><br>

                    Клиентов:
                    <b>${data.customers ?? 0}</b><br>

                    Курьеров:
                    <b>${data.couriers ?? 0}</b><br>

                    Активных заказов:
                    <b>${data.active_orders ?? 0}</b>

                </div>

            </div>
        `;

    }catch(error){

        area.innerHTML =
            `<div class="card">${escapeHtml(
                formatError(error)
            )}</div>`;
    }
}

/*
=========================================================
UTILS
=========================================================
*/

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
