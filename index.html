<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RESTARAN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#09090b;color:#fff;font-family:Inter,Arial,sans-serif}
body{min-height:100vh}
.hidden{display:none!important}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#09090b;z-index:9999}
.loader{text-align:center}
.logo{font-size:30px;font-weight:900;letter-spacing:2px}
.spinner{width:35px;height:35px;border:3px solid #25252b;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

#app{max-width:700px;margin:auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.title{font-size:25px;font-weight:900}
.subtitle{font-size:12px;color:#777;margin-top:4px}
.card{background:#111114;border:1px solid #25252b;border-radius:20px;padding:16px;margin-bottom:14px}
.card-title{font-size:18px;font-weight:800;margin-bottom:14px}
.input{width:100%;height:52px;background:#18181d;border:1px solid #303038;border-radius:14px;color:#fff;padding:0 15px;font-size:15px;outline:none;margin-bottom:10px}
.input:focus{border-color:#777}
button{border:0;border-radius:14px;min-height:48px;padding:0 16px;color:#fff;background:#25252c;font-size:14px;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
.primary{width:100%;background:#fff;color:#000}
.danger{background:#35171a;color:#ff7b83;margin-top:10px;width:100%}
.create{width:100%;background:#173c25;color:#79e99b}
.logout{font-size:12px;min-height:38px}
.error{color:#ff707a;font-size:13px;margin:8px 0}
.muted{color:#777}
.small{font-size:13px;line-height:1.7}

#login{max-width:430px;margin:0 auto;padding:25px 18px}
.login-logo{text-align:center;font-size:34px;font-weight:900;margin:50px 0 30px}
.login-card{background:#111114;border:1px solid #25252b;border-radius:24px;padding:20px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.tab{min-height:42px;padding:0 5px;font-size:11px}
.tab.active{background:#fff;color:#000}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#18181d;border-radius:16px;padding:15px}
.stat-number{font-size:25px;font-weight:900}
.stat-label{font-size:11px;color:#777;margin-top:4px}

.customer,.order,.courier{background:#18181d;border-radius:16px;padding:14px;margin-top:9px}
.customer-name,.order-name{font-weight:800;font-size:16px}
.customer-info{font-size:13px;color:#999;line-height:1.8;margin-top:7px}
.order-head{display:flex;justify-content:space-between;gap:10px}
.order-status{font-size:11px;background:#27272e;border-radius:10px;padding:6px 9px;height:max-content}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:25px;color:#666}

#fatal{position:fixed;inset:0;background:#09090b;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.fatal-card{max-width:430px;width:100%;background:#111114;border:1px solid #452126;border-radius:20px;padding:20px;text-align:center;color:#ff747d}
</style>
</head>

<body>

<div id="loading">
    <div class="loader">
        <div class="logo">RESTARAN</div>
        <div class="spinner"></div>
    </div>
</div>

<div id="fatal" class="hidden">
    <div class="fatal-card">
        <div style="font-size:25px;font-weight:900;margin-bottom:12px">RESTARAN</div>
        <div id="fatalText"></div>
    </div>
</div>

<div id="login" class="hidden">
    <div class="login-logo">RESTARAN</div>

    <div class="login-card">
        <div class="card-title">Вход</div>

        <input id="phone"
               class="input"
               type="tel"
               placeholder="Номер телефона">

        <input id="pin"
               class="input"
               type="password"
               inputmode="numeric"
               maxlength="8"
               placeholder="PIN">

        <div id="loginError" class="error"></div>

        <button class="primary" onclick="login()">
            Войти
        </button>
    </div>
</div>

<div id="app" class="hidden">

    <div class="header">
        <div>
            <div class="title">RESTARAN</div>
            <div id="subtitle" class="subtitle"></div>
        </div>

        <button class="logout" onclick="logout()">
            Выйти
        </button>
    </div>

    <!-- ADMIN -->

    <section id="adminView" class="hidden">

        <div class="tabs">
            <button class="tab active" onclick="tab('orders',this)">Заказы</button>
            <button class="tab" onclick="tab('customers',this)">Клиенты</button>
            <button class="tab" onclick="tab('couriers',this)">Курьеры</button>
            <button class="tab" onclick="tab('stats',this)">Стата</button>
        </div>

        <div id="ordersTab">
            <div id="adminOrdersArea"></div>
        </div>

        <div id="customersTab" class="hidden">
            <div id="adminCustomersArea"></div>
        </div>

        <div id="couriersTab" class="hidden">
            <div id="adminCouriersArea"></div>
        </div>

        <div id="statsTab" class="hidden">
            <div id="adminStatsArea"></div>
        </div>

    </section>

    <!-- CUSTOMER -->

    <section id="customerView" class="hidden">

        <div class="card">
            <div class="card-title">Мой аккаунт</div>
            <div id="customerInfo" class="small"></div>
        </div>

        <div class="card">
            <div class="card-title">Мои заказы</div>
            <div id="customerOrders"></div>
        </div>

    </section>

    <!-- COURIER -->

    <section id="courierView" class="hidden">

        <div class="card">
            <div class="card-title">Курьер</div>
            <button id="onlineButton"
                    class="primary"
                    onclick="toggleOnline()">
                Выйти на линию
            </button>
        </div>

        <div class="card">
            <div class="card-title">Мои заказы</div>
            <div id="courierOrders"></div>
        </div>

    </section>

</div>

<script>
const tg = window.Telegram?.WebApp || null;

const ADMIN_IDS = new Set([
    "8357023784",
    "7003441441"
]);

let token = null;
let role = null;
let user = null;

if(tg){
    tg.ready();
    tg.expand();
}

function $(id){
    return document.getElementById(id);
}

function show(id){
    $(id)?.classList.remove("hidden");
}

function hide(id){
    $(id)?.classList.add("hidden");
}

function esc(v){
    return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function errorText(e){
    if(typeof e === "string") return e;
    return e?.message || "Неизвестная ошибка";
}

function telegramId(){
    return tg?.initDataUnsafe?.user?.id
        ? String(tg.initDataUnsafe.user.id)
        : null;
}

function isAdminTelegram(){
    const id = telegramId();
    return !!id && ADMIN_IDS.has(id);
}

async function api(url,options={}){
    const headers = {
        ...(options.headers || {})
    };

    if(token){
        headers.Authorization = "Bearer " + token;
    }

    let body = options.body;

    if(body && typeof body !== "string"){
        headers["Content-Type"] = "application/json";
        body = JSON.stringify(body);
    }

    const r = await fetch(url,{
        ...options,
        headers,
        body
    });

    let data;

    try{
        data = await r.json();
    }catch{
        data = {};
    }

    if(!r.ok){
        throw new Error(
            typeof data.detail === "string"
                ? data.detail
                : "Ошибка сервера"
        );
    }

    return data;
}

function fatal(message){
    hide("loading");
    hide("login");
    hide("app");
    show("fatal");
    $("fatalText").textContent = message;
}

async function adminLogin(){

    if(!isAdminTelegram()){
        return false;
    }

    hide("login");

    if(!tg){
        throw new Error(
            "Откройте Web App через Telegram."
        );
    }

    if(!tg.initData){
        throw new Error(
            "Telegram initData отсутствует. Откройте приложение через Telegram."
        );
    }

    const result = await api(
        "/api/admin/web-login",
        {
            method:"POST",
            body:{
                init_data:tg.initData
            }
        }
    );

    token = result.token;
    role = "admin";
    user = result.user;

    localStorage.removeItem("restaran_token");
    localStorage.setItem(
        "restaran_admin_token",
        token
    );

    return true;
}

async function login(){

    if(isAdminTelegram()){
        try{
            await adminLogin();
            await showApp();
        }catch(e){
            fatal(errorText(e));
        }
        return;
    }

    const phone = $("phone").value.trim();
    const pin = $("pin").value.trim();

    $("loginError").textContent = "";

    if(!phone || !pin){
        $("loginError").textContent =
            "Введите телефон и PIN";
        return;
    }

    try{

        const result = await api(
            "/api/login",
            {
                method:"POST",
                body:{phone,pin}
            }
        );

        token = result.token;
        role = result.role;
        user = result.user;

        localStorage.setItem(
            "restaran_token",
            token
        );

        await showApp();

    }catch(e){

        $("loginError").textContent =
            errorText(e);
    }
}

async function showApp(){

    hide("loading");
    hide("login");
    show("app");

    hide("adminView");
    hide("customerView");
    hide("courierView");

    if(role === "admin"){

        hide("login");
        show("adminView");

        $("subtitle").textContent =
            "Администратор";

        await loadAdmin();
        return;
    }

    if(role === "customer"){

        show("customerView");

        $("subtitle").textContent =
            "Клиент";

        $("customerInfo").innerHTML = `
            <b>${esc(user?.name || "Клиент")}</b><br>
            📱 ${esc(user?.phone || "—")}
        `;

        await loadCustomerOrders();
        return;
    }

    if(role === "courier"){

        show("courierView");

        $("subtitle").textContent =
            "Курьер";

        await loadCourierOrders();
    }
}

async function loadAdmin(){

    if(role !== "admin"){
        return;
    }

    await Promise.all([
        loadOrders(),
        loadCustomers(),
        loadCouriers(),
        loadStats()
    ]);
}

function tab(name,button){

    document.querySelectorAll(".tab")
        .forEach(x=>x.classList.remove("active"));

    button?.classList.add("active");

    hide("ordersTab");
    hide("customersTab");
    hide("couriersTab");
    hide("statsTab");

    if(name==="orders") show("ordersTab");
    if(name==="customers") show("customersTab");
    if(name==="couriers") show("couriersTab");
    if(name==="stats") show("statsTab");
}

async function loadOrders(){

    const area = $("adminOrdersArea");
    if(!area)return;

    try{

        const data =
            await api("/api/admin/orders");

        if(!data.length){
            area.innerHTML =
                `<div class="card empty">Заказов нет</div>`;
            return;
        }

        area.innerHTML = `
            <div class="card">
                <div class="card-title">Заказы</div>
                ${data.map(o=>`
                    <div class="order">
                        <div class="order-head">
                            <div class="order-name">
                                #${esc(o.id)}
                            </div>
                            <div class="order-status">
                                ${esc(o.status)}
                            </div>
                        </div>
                        <div class="small muted">
                            👤 ${esc(o.customer_name || "—")}<br>
                            📍 ${esc(o.address || "—")}<br>
                            💰 ${esc(o.price || 0)}
                        </div>
                    </div>
                `).join("")}
            </div>
        `;

    }catch(e){

        area.innerHTML =
            `<div class="card error">${esc(errorText(e))}</div>`;
    }
}

async function loadCustomers(){

    const area = $("adminCustomersArea");
    if(!area)return;

    try{

        const data =
            await api("/api/admin/customers");

        area.innerHTML = `

            <div class="card">

                <div class="card-title">
                    Новый клиент
                </div>

                <input
                    id="newCustomerName"
                    class="input"
                    placeholder="Имя"
                >

                <input
                    id="newCustomerPhone"
                    class="input"
                    type="tel"
                    placeholder="Номер телефона"
                >

                <input
                    id="newCustomerPin"
                    class="input"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="PIN клиента"
                >

                <button
                    class="create"
                    onclick="createCustomer()"
                >
                    Создать аккаунт
                </button>

            </div>

            <div class="card">

                <div class="card-title">
                    Клиенты
                </div>

                ${
                    data.length
                    ?
                    data.map(c=>`

                        <div class="customer">

                            <div class="customer-name">
                                ${esc(c.name)}
                            </div>

                            <div class="customer-info">
                                📱 ${esc(c.phone)}<br>
                                🔐 PIN:
                                <b>${esc(c.pin_plain || "—")}</b><br>
                                ${
                                    c.active
                                    ? "🟢 Активен"
                                    : "🔴 Удалён"
                                }
                            </div>

                            ${
                                c.active
                                ?
                                `<button
                                    class="danger"
                                    onclick="deleteCustomer(${Number(c.id)})"
                                >
                                    🗑 Удалить аккаунт
                                </button>`
                                :
                                ""
                            }

                        </div>

                    `).join("")
                    :
                    `<div class="empty">Клиентов нет</div>`
                }

            </div>
        `;

    }catch(e){

        area.innerHTML =
            `<div class="card error">${esc(errorText(e))}</div>`;
    }
}

async function createCustomer(){

    const name =
        $("newCustomerName")?.value.trim();

    const phone =
        $("newCustomerPhone")?.value.trim();

    const pin =
        $("newCustomerPin")?.value.trim();

    if(!name){
        alert("Введите имя");
        return;
    }

    if(!phone){
        alert("Введите номер телефона");
        return;
    }

    if(!/^\d{4,8}$/.test(pin)){
        alert("PIN должен содержать 4-8 цифр");
        return;
    }

    try{

        await api(
            "/api/admin/customers",
            {
                method:"POST",
                body:{name,phone,pin}
            }
        );

        await loadCustomers();
        await loadStats();

    }catch(e){

        alert(errorText(e));
    }
}

async function deleteCustomer(id){

    if(!confirm("Удалить аккаунт клиента?")){
        return;
    }

    try{

        await api(
            "/api/admin/customers/" +
            encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );

        await loadCustomers();
        await loadStats();

    }catch(e){

        alert(errorText(e));
    }
}

async function loadCouriers(){

    const area = $("adminCouriersArea");
    if(!area)return;

    try{

        const data =
            await api("/api/admin/couriers");

        area.innerHTML = `
            <div class="card">
                <div class="card-title">Курьеры</div>

                ${
                    data.length
                    ?
                    data.map(c=>`
                        <div class="courier">
                            <div class="customer-name">
                                ${esc(c.name || "Курьер")}
                            </div>
                            <div class="customer-info">
                                📱 ${esc(c.phone || "—")}<br>
                                ${
                                    c.online
                                    ? "🟢 Онлайн"
                                    : "⚫ Оффлайн"
                                }
                            </div>
                        </div>
                    `).join("")
                    :
                    `<div class="empty">Курьеров нет</div>`
                }

            </div>
        `;

    }catch(e){

        area.innerHTML =
            `<div class="card error">${esc(errorText(e))}</div>`;
    }
}

async function loadStats(){

    const area = $("adminStatsArea");
    if(!area)return;

    try{

        const s =
            await api("/api/admin/stats");

        area.innerHTML = `
            <div class="card">
                <div class="card-title">
                    Статистика
                </div>

                <div class="stat-grid">

                    <div class="stat">
                        <div class="stat-number">
                            ${Number(s.orders || 0)}
                        </div>
                        <div class="stat-label">
                            Заказов
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-number">
                            ${Number(s.customers || 0)}
                        </div>
                        <div class="stat-label">
                            Клиентов
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-number">
                            ${Number(s.couriers || 0)}
                        </div>
                        <div class="stat-label">
                            Курьеров
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-number">
                            ${Number(s.active_orders || 0)}
                        </div>
                        <div class="stat-label">
                            Активных
                        </div>
                    </div>

                </div>
            </div>
        `;

    }catch(e){

        area.innerHTML =
            `<div class="card error">${esc(errorText(e))}</div>`;
    }
}

async function loadCustomerOrders(){

    const area = $("customerOrders");
    if(!area)return;

    try{

        const data =
            await api("/api/orders");

        area.innerHTML =
            data.length
            ?
            data.map(o=>`
                <div class="order">
                    <div class="order-head">
                        <div class="order-name">
                            #${esc(o.id)}
                        </div>
                        <div class="order-status">
                            ${esc(o.status)}
                        </div>
                    </div>
                    <div class="small muted">
                        ${esc(o.title || "Заказ")}<br>
                        📍 ${esc(o.address || "—")}
                    </div>
                </div>
            `).join("")
            :
            `<div class="empty">Заказов нет</div>`;

    }catch(e){

        area.innerHTML =
            `<div class="error">${esc(errorText(e))}</div>`;
    }
}

async function loadCourierOrders(){

    const area = $("courierOrders");
    if(!area)return;

    try{

        const data =
            await api("/api/courier/orders");

        area.innerHTML =
            data.length
            ?
            data.map(o=>`
                <div class="order">
                    <div class="order-head">
                        <div class="order-name">
                            #${esc(o.id)}
                        </div>
                        <div class="order-status">
                            ${esc(o.status)}
                        </div>
                    </div>
                    <div class="small muted">
                        👤 ${esc(o.customer_name || "—")}<br>
                        📍 ${esc(o.address || "—")}
                    </div>
                </div>
            `).join("")
            :
            `<div class="empty">Заказов нет</div>`;

    }catch(e){

        area.innerHTML =
            `<div class="error">${esc(errorText(e))}</div>`;
    }
}

async function toggleOnline(){

    try{

        const r =
            await api(
                "/api/courier/online",
                {method:"POST"}
            );

        $("onlineButton").textContent =
            r.online
            ? "Выйти с линии"
            : "Выйти на линию";

    }catch(e){

        alert(errorText(e));
    }
}

async function logout(){

    if(isAdminTelegram()){

        try{
            await adminLogin();
            await showApp();
        }catch(e){
            fatal(errorText(e));
        }

        return;
    }

    try{
        await api("/api/logout",{
            method:"POST"
        });
    }catch{}

    localStorage.removeItem("restaran_token");

    token = null;
    role = null;
    user = null;

    hide("app");
    show("login");
}

async function boot(){

    /*
     * АДМИН ПРОВЕРЯЕТСЯ ПЕРВЫМ.
     * LOGIN ДЛЯ АДМИНА НИКОГДА НЕ ПОКАЗЫВАЕТСЯ.
     */

    hide("login");
    hide("app");

    if(isAdminTelegram()){

        try{

            await adminLogin();
            await showApp();

            return;

        }catch(e){

            fatal(errorText(e));
            return;
        }
    }

    const saved =
        localStorage.getItem(
            "restaran_token"
        );

    if(saved){

        try{

            token = saved;

            const me =
                await api("/api/me");

            role = me.role;
            user = me.user;

            await showApp();

            return;

        }catch{

            localStorage.removeItem(
                "restaran_token"
            );

            token = null;
        }
    }

    hide("loading");
    show("login");
}

if(document.readyState === "loading"){

    document.addEventListener(
        "DOMContentLoaded",
        boot,
        {once:true}
    );

}else{

    boot();
}
</script>

</body>
    </html>
