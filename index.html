<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Delivery</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#07080d;
    --card:rgba(255,255,255,.065);
    --card2:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.1);
    --text:#fff;
    --muted:#969baa;
    --purple:#7657ff;
    --blue:#458cff;
    --green:#35d49a;
    --red:#ff6372;
}

html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}

body{
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    border:0;
}

.hidden{
    display:none!important;
}

/* =====================================================
   LOADER
===================================================== */

#loader{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(118,87,255,.25),
            transparent 40%
        ),
        var(--bg);
}

.loader{
    text-align:center;
    animation:pop .7s ease;
}

.logo{
    width:80px;
    height:80px;
    border-radius:27px;
    display:grid;
    place-items:center;
    margin:auto;
    font-size:38px;
    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );
    box-shadow:
        0 20px 80px
        rgba(118,87,255,.35);
}

.loader p{
    color:var(--muted);
    margin-top:18px;
}

/* =====================================================
   LOGIN
===================================================== */

#login{
    position:fixed;
    inset:0;
    z-index:5000;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            circle at 50% 0,
            rgba(118,87,255,.25),
            transparent 45%
        ),
        var(--bg);
}

.loginBox{
    width:100%;
    max-width:430px;
    animation:pop .7s ease;
}

.loginPhoto{
    height:235px;
    border-radius:30px;
    margin-bottom:22px;
    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        ),
        url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&q=85")
        center/cover;
}

.loginTitle{
    font-size:32px;
    font-weight:900;
}

.loginText{
    color:var(--muted);
    line-height:1.45;
    margin:8px 0 20px;
}

.input{
    width:100%;
    padding:17px;
    border-radius:17px;
    border:1px solid var(--border);
    outline:none;
    background:var(--card);
    color:white;
    margin-bottom:12px;
}

.input:focus{
    border-color:rgba(118,87,255,.7);
}

.primary{
    width:100%;
    padding:17px;
    border-radius:17px;
    color:white;
    font-weight:800;
    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );
    box-shadow:
        0 15px 50px
        rgba(118,87,255,.25);
    transition:.2s;
}

.primary:active{
    transform:scale(.97);
}

/* =====================================================
   APP
===================================================== */

#app{
    max-width:650px;
    margin:auto;
    min-height:100vh;
    padding-bottom:100px;
}

.header{
    padding:24px 18px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.headerTitle{
    font-size:27px;
    font-weight:900;
}

.headerSub{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.avatar{
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border-radius:16px;
    background:var(--card);
    border:1px solid var(--border);
    font-size:21px;
}

.content{
    padding:10px 16px;
}

.card{
    padding:18px;
    margin-bottom:14px;
    border-radius:25px;
    border:1px solid var(--border);
    background:var(--card);
    backdrop-filter:blur(20px);
    box-shadow:
        0 15px 50px
        rgba(0,0,0,.18);
    animation:up .45s ease;
}

.hero{
    min-height:195px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        ),
        url("https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1000&q=85")
        center/cover;
}

.hero h1{
    margin:0 0 6px;
    font-size:29px;
}

.hero p{
    margin:0;
    color:#ddd;
}

.muted{
    color:var(--muted);
}

.status{
    display:inline-flex;
    padding:7px 11px;
    border-radius:100px;
    background:rgba(53,212,154,.12);
    color:var(--green);
    font-size:12px;
    font-weight:800;
}

.orderTitle{
    margin:13px 0 5px;
    font-size:21px;
    font-weight:900;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.row:last-child{
    border-bottom:0;
}

.mapButton{
    width:100%;
    margin-top:13px;
    padding:15px;
    border-radius:16px;
    color:white;
    font-weight:800;
    background:rgba(118,87,255,.17);
    border:1px solid rgba(118,87,255,.35);
}

/* =====================================================
   MAP
===================================================== */

.mapCard{
    padding:0;
    overflow:hidden;
}

.mapHeader{
    padding:17px;
    display:flex;
    justify-content:space-between;
}

#map{
    width:100%;
    height:410px;
}

/* =====================================================
   ADMIN
===================================================== */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat{
    padding:17px;
    border-radius:20px;
    background:var(--card2);
    border:1px solid var(--border);
}

.statNumber{
    font-size:28px;
    font-weight:900;
}

.statLabel{
    margin-top:5px;
    font-size:12px;
    color:var(--muted);
}

.action{
    width:100%;
    padding:17px;
    margin-bottom:10px;
    text-align:left;
    border-radius:17px;
    color:white;
    background:var(--card2);
    border:1px solid var(--border);
}

.action small{
    color:var(--muted);
}

/* =====================================================
   NAV
===================================================== */

.nav{
    position:fixed;
    z-index:1000;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:620px;
    padding:8px;
    display:flex;
    gap:5px;
    border:1px solid var(--border);
    border-radius:23px;
    background:rgba(15,16,23,.88);
    backdrop-filter:blur(25px);
    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);
}

.navBtn{
    flex:1;
    padding:11px 5px;
    border-radius:17px;
    color:var(--muted);
    background:transparent;
    font-size:11px;
}

.navBtn.active{
    color:white;
    background:rgba(118,87,255,.2);
}

/* =====================================================
   TOAST
===================================================== */

#toast{
    position:fixed;
    z-index:99999;
    left:50%;
    bottom:90px;
    transform:
        translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:13px 17px;
    border-radius:15px;
    background:#181921;
    border:1px solid var(--border);
    transition:.3s;
}

#toast.show{
    opacity:1;
    transform:
        translate(-50%,0);
}

/* =====================================================
   ANIMATION
===================================================== */

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.94);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes up{
    from{
        opacity:0;
        transform:translateY(16px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<!-- LOADER -->

<div id="loader">

    <div class="loader">

        <div class="logo">
            🍔
        </div>

        <p>
            Загружаем приложение...
        </p>

    </div>

</div>


<!-- LOGIN -->

<div
    id="login"
    class="hidden"
>

    <div class="loginBox">

        <div class="loginPhoto"></div>

        <div class="loginTitle">
            Добро пожаловать 👋
        </div>

        <div class="loginText">
            Введи номер телефона,
            который зарегистрировал администратор.
        </div>

        <input
            id="phone"
            class="input"
            type="tel"
            placeholder="+374 XX XX XX XX"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Продолжить
        </button>

    </div>

</div>


<!-- APP -->

<div
    id="app"
    class="hidden"
>

    <header class="header">

        <div>

            <div
                id="hello"
                class="headerTitle"
            >
                Привет 👋
            </div>

            <div class="headerSub">
                Delivery
            </div>

        </div>

        <div class="avatar">
            🍔
        </div>

    </header>


    <main
        id="content"
        class="content"
    ></main>


    <nav class="nav">

        <button
            class="navBtn active"
            onclick="home(this)"
        >
            🏠<br>
            Главная
        </button>

        <button
            class="navBtn"
            onclick="ordersPage(this)"
        >
            📦<br>
            Заказы
        </button>

        <button
            class="navBtn"
            onclick="mapPage(this)"
        >
            📍<br>
            Карта
        </button>

        <button
            id="adminButton"
            class="navBtn hidden"
            onclick="adminPage(this)"
        >
            ⚙️<br>
            Админ
        </button>

    </nav>

</div>


<div id="toast"></div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let me = null;
let socket = null;
let map = null;
let markers = {};
let page = "home";

const content =
    document.getElementById("content");


// ======================================================
// API
// ======================================================

async function api(
    url,
    options={}
){

    options.headers = {
        ...(options.headers || {}),
        "X-Telegram-Init-Data":
            tg.initData
    };

    const response =
        await fetch(
            url,
            options
        );

    const data =
        await response.json();

    if(!response.ok){
        throw new Error(
            data.error || "Ошибка"
        );
    }

    return data;
}


// ======================================================
// TOAST
// ======================================================

function toast(text){

    const el =
        document.getElementById("toast");

    el.textContent = text;

    el.classList.add("show");

    setTimeout(
        () => el.classList.remove("show"),
        2600
    );
}


// ======================================================
// INIT
// ======================================================

async function init(){

    try{

        me =
            await api("/api/me");

        document
            .getElementById("loader")
            .classList.add("hidden");

        if(
            me.role === "customer" &&
            !me.customer
        ){

            document
                .getElementById("login")
                .classList.remove("hidden");

            return;
        }

        openApp();

    }catch(error){

        document
            .getElementById("loader")
            .classList.add("hidden");

        toast(error.message);

    }
}


// ======================================================
// OPEN
// ======================================================

function openApp(){

    document
        .getElementById("login")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    document
        .getElementById("hello")
        .textContent =
        `Привет, ${me.name || "друг"} 👋`;

    if(me.role === "admin"){

        document
            .getElementById("adminButton")
            .classList.remove("hidden");

    }

    connectSocket();

    if(me.role === "admin")
        adminPage();

    else if(me.role === "courier")
        courierPage();

    else
        home();
}


// ======================================================
// LOGIN
// ======================================================

async function login(){

    const phone =
        document
            .getElementById("phone")
            .value
            .trim();

    if(!phone){

        toast(
            "Введите номер телефона"
        );

        return;
    }

    try{

        await api(
            "/api/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    phone
                })
            }
        );

        me =
            await api("/api/me");

        openApp();

        toast(
            "Авторизация успешна"
        );

    }catch(error){

        toast(error.message);

    }
}


// ======================================================
// HOME
// ======================================================

async function home(button){

    setActive(button);

    page = "home";

    if(me.role === "courier"){
        courierPage(button);
        return;
    }

    if(me.role === "admin"){
        adminPage(button);
        return;
    }

    content.innerHTML = `

        <div class="card hero">

            <h1>
                Доставка еды 🍔
            </h1>

            <p>
                Быстро. Удобно. Прямо к тебе.
            </p>

        </div>

        <div id="orders">
            <div class="card">
                Загрузка...
            </div>
        </div>

    `;

    loadOrders();
}


async function loadOrders(){

    try{

        const data =
            await api("/api/orders");

        const box =
            document.getElementById("orders");

        if(!data.orders.length){

            box.innerHTML = `

                <div class="card">

                    <div
                        style="font-size:42px"
                    >
                        🍽️
                    </div>

                    <h2>
                        Нет активных заказов
                    </h2>

                    <p class="muted">
                        Здесь появится твой заказ.
                    </p>

                </div>

            `;

            return;
        }

        box.innerHTML =
            data.orders.map(
                order => `

                <div class="card">

                    <span class="status">
                        ${escapeHtml(order.status)}
                    </span>

                    <div class="orderTitle">
                        Заказ #${order.id}
                    </div>

                    <div class="row">

                        <span class="muted">
                            📍 Адрес
                        </span>

                        <b>
                            ${escapeHtml(
                                order.address || "—"
                            )}
                        </b>

                    </div>

                    <div class="row">

                        <span class="muted">
                            🚴 Курьер
                        </span>

                        <b>
                            ${escapeHtml(
                                order.courier_name ||
                                "Не назначен"
                            )}
                        </b>

                    </div>

                    ${
                        order.courier_lat &&
                        order.courier_lon
                        ?
                        `
                        <button
                            class="mapButton"
                            onclick="mapPage()"
                        >
                            📍 Посмотреть геопозицию курьера
                        </button>
                        `
                        :
                        `
                        <div
                            class="muted"
                            style="margin-top:13px"
                        >
                            📍 Геопозиция пока недоступна
                        </div>
                        `
                    }

                </div>

            `
            ).join("");

    }catch(error){

        toast(error.message);

    }
}


// ======================================================
// COURIER
// ======================================================

async function courierPage(button){

    setActive(button);

    page = "courier";

    content.innerHTML = `

        <div class="card hero">

            <h1>
                Панель курьера 🚴
            </h1>

            <p>
                Управление доставкой
            </p>

        </div>

        <div class="card">

            <div class="row">

                <span>
                    Статус
                </span>

                <b id="courierStatus">
                    ${
                        me.courier?.online
                        ? "🟢 Онлайн"
                        : "⚫ Оффлайн"
                    }
                </b>

            </div>

            <button
                class="primary"
                onclick="toggleOnline()"
            >
                Изменить статус
            </button>

        </div>

        <div id="courierOrders"></div>

        <div class="card">

            <h3>
                📍 Геопозиция
            </h3>

            <p class="muted">
                Отправляй геопозицию прямо
                этому Telegram-боту.
            </p>

            <p class="muted">
                Для автоматических обновлений
                используй Live Location.
            </p>

        </div>

    `;

    loadCourierOrders();
}


async function toggleOnline(){

    const online =
        !Boolean(
            me.courier?.online
        );

    try{

        await api(
            "/api/courier/online",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    online
                })
            }
        );

        me.courier.online =
            online;

        document
            .getElementById(
                "courierStatus"
            )
            .textContent =
            online
            ? "🟢 Онлайн"
            : "⚫ Оффлайн";

        toast(
            online
            ? "Ты онлайн"
            : "Ты оффлайн"
        );

    }catch(error){

        toast(error.message);

    }
}


async function loadCourierOrders(){

    try{

        const data =
            await api(
                "/api/courier/orders"
            );

        const box =
            document.getElementById(
                "courierOrders"
            );

        if(!data.orders.length){

            box.innerHTML = `

                <div class="card">

                    <h3>
                        📦 Нет заказов
                    </h3>

                    <p class="muted">
                        Новые заказы появятся здесь.
                    </p>

                </div>

            `;

            return;
        }

        box.innerHTML =
            data.orders.map(
                order => `

                <div class="card">

                    <span class="status">
                        ${escapeHtml(
                            order.status
                        )}
                    </span>

                    <div class="orderTitle">
                        Заказ #${order.id}
                    </div>

                    <div class="row">

                        <span class="muted">
                            Клиент
                        </span>

                        <b>
                            ${escapeHtml(
                                order.customer_name ||
                                "—"
                            )}
                        </b>

                    </div>

                    <div class="row">

                        <span class="muted">
                            Телефон
                        </span>

                        <b>
                            ${escapeHtml(
                                order.customer_phone ||
                                "—"
                            )}
                        </b>

                    </div>

                    <div class="row">

                        <span class="muted">
                            Адрес
                        </span>

                        <b>
                            ${escapeHtml(
                                order.address ||
                                "—"
                            )}
                        </b>

                    </div>

                    <button
                        class="primary"
                        onclick="completeOrder(${order.id})"
                    >
                        ✅ Доставлено
                    </button>

                </div>

            `
            ).join("");

    }catch(error){

        toast(error.message);

    }
}


async function completeOrder(id){

    try{

        await api(
            `/api/courier/orders/${id}/complete`,
            {
                method:"POST"
            }
        );

        toast(
            "Заказ завершён"
        );

        loadCourierOrders();

    }catch(error){

        toast(error.message);

    }
}


// ======================================================
// MAP
// ======================================================

async function mapPage(button){

    setActive(button);

    page = "map";

    content.innerHTML = `

        <div class="card mapCard">

            <div class="mapHeader">

                <b>
                    📍 Курьеры
                </b>

                <span class="muted">
                    LIVE
                </span>

            </div>

            <div id="map"></div>

        </div>

    `;

    map =
        L.map(
            "map"
        ).setView(
            [40.1792,44.4991],
            13
        );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap"
        }
    ).addTo(map);

    try{

        if(me.role === "admin"){

            const data =
                await api(
                    "/api/admin/couriers"
                );

            data.couriers.forEach(
                addMarker
            );

        }else{

            const data =
                await api(
                    "/api/orders"
                );

            const order =
                data.orders.find(
                    x =>
                        x.courier_lat &&
                        x.courier_lon
                );

            if(order){

                updateMarker(
                    order.courier_id,
                    order.courier_name,
                    order.courier_lat,
                    order.courier_lon
                );

                map.setView(
                    [
                        order.courier_lat,
                        order.courier_lon
                    ],
                    16
                );
            }
        }

    }catch(error){

        toast(error.message);

    }
}


function addMarker(courier){

    if(
        !courier.lat ||
        !courier.lon
    )
        return;

    updateMarker(
        courier.id,
        courier.name,
        courier.lat,
        courier.lon
    );
}


function updateMarker(
    id,
    name,
    lat,
    lon
){

    if(!map)
        return;

    if(markers[id]){

        markers[id].setLatLng([
            lat,
            lon
        ]);

    }else{

        markers[id] =
            L.marker([
                lat,
                lon
            ])
            .addTo(map)
            .bindPopup(
                `🚴 ${escapeHtml(
                    name || "Курьер"
                )}`
            );
    }
}


// ======================================================
// ADMIN
// ======================================================

async function adminPage(button){

    setActive(button);

    page = "admin";

    content.innerHTML = `

        <div class="card hero">

            <h1>

            .getElementById(
                "customerPhone"

        await api(
            "/api/admin/customers",
            {
                method:"POST",
                headers:{
                    "Content-Type":

                body:JSON.stringify({

        );

// ======================================================
// ORDERS NAV
// ======================================================

function ordersPage(button){

    setActive(button);

    if(me.role === "courier"){

        courierPage(button);
        return;
    }

    if(me.role === "admin"){

        adminOrders();
        return;
    }

    home(button);
}


// ======================================================
// ACTIVE NAV
// ======================================================

function setActive(button){

    document
        .querySelectorAll(".navBtn")
        .forEach(
            b => b.classList.remove(
                "active"
            )
        );

    if(button)
        button.classList.add(
            "active"
        );
}


// ======================================================
// WEBSOCKET
// ======================================================

function connectSocket(){

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    socket =
        new WebSocket(
            `${protocol}//${location.host}/ws`
        );

    socket.onmessage =
        event => {

            const data =
                JSON.parse(
                    event.data
                );

            if(
                data.type ===
                "courier_location"
            ){

                if(page === "map"){

                    updateMarker(
                        data.courier_id,
                        data.name,
                        data.lat,
                        data.lon
                    );

                }

            }

            if(
                data.type === "new_order" ||
                data.type === "order_update"
            ){

                if(
                    me.role === "customer" &&
                    page === "home"
                ){

                    loadOrders();

                }

                if(
                    me.role === "courier" &&
                    page === "courier"
                ){

                    loadCourierOrders();

                }

            }

        };

    socket.onclose =
        () => {

            setTimeout(
                connectSocket,
                3000
            );

        };
}


// ======================================================
// ESCAPE
// ======================================================

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
