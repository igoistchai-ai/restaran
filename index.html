 name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover"
>

 rel="preconnect"

>

<style>

:root{

 --bg:#07090d;
 --surface:#10141b;
 --surface2:#151a22;

 --text:#f7f8fa;
 --muted:#858e9e;

 --border:rgba(255,255,255,.08);

 --green:#63e69a;
 --red:#ff6d7e;

 --radius:24px;

}

*{
 box-sizing:border-box;
}

body{

 margin:0;

 min-height:100vh;

 color:var(--text);

 background:

 radial-gradient(
  circle at 50% -10%,
  #303847 0,
  #11151d 35%,
  #07090d 75%
 );

 font-family:
 Inter,
 system-ui,
 sans-serif;

}

button,
input,
select{

 font:inherit;

}

button{

 cursor:pointer;

}

.hidden{
 display:none!important;
}

/* =========================
   AUTH
========================= */

.auth{

 min-height:100vh;

 display:flex;

 justify-content:center;
 align-items:center;

 padding:20px;

}

.auth-box{

 width:100%;
 max-width:430px;

 padding:28px;

 border-radius:32px;

 background:
 rgba(16,20,27,.82);

 border:1px solid var(--border);

 backdrop-filter:blur(30px);

 box-shadow:
 0 30px 100px rgba(0,0,0,.55);

 animation:
 appear .5s ease;

}

.logo{

 font-size:24px;

 font-weight:800;

 letter-spacing:-1.5px;

}

.logo span{

 opacity:.35;

}

.hero{

 height:210px;

 margin:24px 0;

 border-radius:24px;

 background:

 linear-gradient(
  to bottom,
  transparent,
  rgba(0,0,0,.9)
 ),

 url(
 "https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1000&q=85"
 );

 background-size:cover;

 background-position:center;

}

.eyebrow{

 color:var(--muted);

 font-size:11px;

 letter-spacing:2px;

 text-transform:uppercase;

}

h1{

 font-size:34px;

 line-height:1.05;

 letter-spacing:-1.8px;

 margin:8px 0 12px;

}

h2{

 letter-spacing:-.7px;

}

.description{

 color:var(--muted);

 font-size:14px;

 line-height:1.6;

}

.field{

 margin:18px 0;

}

.field label{

 display:block;

 color:var(--muted);

 font-size:12px;

 margin-bottom:8px;

}

.input{

 width:100%;

 padding:15px 16px;

 color:white;

 background:#0b0f15;

 border:1px solid var(--border);

 border-radius:16px;

 outline:none;

 transition:.2s;

}

.input:focus{

 border-color:
 rgba(255,255,255,.3);

 box-shadow:
 0 0 0 4px
  rgba(255,255,255,.04);

}

.btn{

 border:0;

 border-radius:16px;

 padding:14px 17px;

 font-weight:700;

 transition:.2s;

}

.btn:hover{

 transform:translateY(-1px);

}

.btn-main{

 width:100%;

 color:#07090d;

 background:#fff;

}

.btn-dark{

 color:white;

 background:#1a202a;

 border:1px solid var(--border);

}

.btn-green{

 color:#07120b;

 background:var(--green);

}

.btn-red{

 color:#ff9aa5;

 background:
 rgba(255,100,120,.12);

}

/* =========================
   HEADER
========================= */

.topbar{

 position:sticky;

 top:0;

 z-index:20;

 border-bottom:
 1px solid var(--border);

 background:
 rgba(7,9,13,.75);

 backdrop-filter:
 blur(22px);

}

.topbar-inner{

 max-width:1200px;

 margin:auto;

 padding:15px 20px;

 display:flex;

 align-items:center;

 justify-content:space-between;

}

/* =========================
   LAYOUT
========================= */

.container{

 max-width:1200px;

 margin:auto;

 padding:
 28px
 20px
 100px;

}

.grid{

 display:grid;

 grid-template-columns:
 repeat(12,1fr);

 gap:16px;

}

.col-12{
 grid-column:span 12;
}

.col-8{
 grid-column:span 8;
}

.col-6{
 grid-column:span 6;
}

.col-4{
 grid-column:span 4;
}

.card{

 background:
 rgba(16,20,27,.82);

 border:
 1px solid var(--border);

 border-radius:
 var(--radius);

 padding:20px;

 box-shadow:
 0 15px 50px
 rgba(0,0,0,.16);

}

.stat-number{

 font-size:32px;

 font-weight:800;

 letter-spacing:-1.5px;

 margin-top:7px;

}

.muted{
 color:var(--muted);
}

.row{

 display:flex;

 align-items:center;

 justify-content:space-between;

 gap:15px;

}

.status{

 display:inline-flex;

 padding:7px 10px;

 border-radius:999px;

 background:#0b0f15;

 border:1px solid var(--border);

 font-size:11px;

 font-weight:700;

}

.status.green{

 color:var(--green);

}

.status.red{

 color:#ff8b99;

}

.actions{

 display:flex;

 flex-wrap:wrap;

 gap:8px;

 margin-top:15px;

}

.actions .btn{

 padding:10px 13px;

 font-size:12px;

}

/* =========================
   MAP
========================= */

.map{

 height:470px;

 border-radius:20px;

 overflow:hidden;

 margin-top:15px;

}

/* =========================
   TABLE
========================= */

.table-wrap{

 overflow:auto;

}

table{

 width:100%;

 border-collapse:collapse;

 font-size:13px;

}

th,
td{

 padding:14px 10px;

 text-align:left;

 border-bottom:
 1px solid var(--border);

 white-space:nowrap;

}

th{

 color:var(--muted);

 font-weight:500;

}

/* =========================
   MODAL
========================= */

.modal{

 position:fixed;

 inset:0;

 z-index:100;

 display:flex;

 align-items:center;

 justify-content:center;

 padding:20px;

 background:
 rgba(0,0,0,.72);

 backdrop-filter:
 blur(10px);

}

.modal-box{

 width:100%;

 max-width:500px;

 padding:23px;

 border-radius:26px;

 background:#11161e;

 border:1px solid var(--border);

 animation:
 appear .25s ease;

}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

 .col-8,
 .col-6,
 .col-4{

  grid-column:span 12;

 }

 h1{

  font-size:30px;

 }

 .hero{

  height:180px;

 }

 .row{

  align-items:flex-start;

  flex-direction:column;

 }

}

/* =========================
   ANIMATION
========================= */

@keyframes appear{

 from{

  opacity:0;

  transform:
   translateY(12px)
   scale(.985);

 }

 to{

  opacity:1;

  transform:none;

 }

}

</style>

</head>

<body>

<div id="toast" class="hidden"></div>

     LOGIN
========================= -->

 id="loginPage"
 class="auth"
>

<div class="auth-box">

<div class="logo">
 RESTARAN<span>.</span>
</div>

 premium food delivery
</div>

Войти

========================= -->

Выйти

<main

>

 my account
</div>

<h1 id="customerName">
 Добро пожаловать
</h1>

</div>

<div class="grid">

<div
 class="card col-12"
 id="customerOrders"
>
</div>

<div
 id="customerMapBox"
 class="card col-12 hidden"
>

<div class="eyebrow">
 live delivery
</div>

 Курьер в пути
</h2>

<div class="description">
 Позиция обновляется автоматически.
</div>

<div
 id="customerMap"
 class="map"
></div>

</div>

</div>

</main>


<!-- COURIER -->

<main

>

<div

>

<div>

<div class="eyebrow">

</div>

<h1 id="courierName">
 Курьер

● Онлайн

<!-- =========================
     ADMIN
========================= -->

<section
 id="adminPage"

>

<header class="topbar">

<div class="topbar-inner">

<div class="logo">

RESTARAN<span>.</span>

<small
 class="muted"
>
 ADMIN
</small>

</div>

<button
 class="btn btn-dark"
 onclick="logout()"
>

Выйти

</button>

</div>

</header>


<main class="container">

<div style="margin-bottom:25px">

<div class="eyebrow">
 control center
</div>

<h1>
 Dashboard
</h1>

</div>


<div
 id="stats"
 class="grid"
 style="margin-bottom:25px"
>
</div>


<div
 id="adminTabs"
 style="

 "
>

<button
 class="btn btn-dark"

>
 Заказы

>
 Клиенты

>

     MODAL
========================= -->

<div

>

<div

>
</div>

<script
 src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

const $ = id =>
 document.getElementById(id);


let token =
 localStorage.getItem(
  "restaran_token"
 );

let role =
 localStorage.getItem(
  "restaran_role"
 );

let me = null;

let socket = null;

let customerMap = null;

let customerMarker = null;


/* =========================
   API
========================= */

async function api(
 url,
 options={}
){

 const response =
  await fetch(
   url,
   {
    ...options,

    headers:{
     "Content-Type":
      "application/json",

     "Authorization":
      "Bearer " + token,

     ...(options.headers || {})
    }
   }
  );

 const data =
  await response
   .json()
   .catch(
    () => ({})
   );

 if(!response.ok){

  throw new Error(
   data.detail ||
   "Ошибка сервера"
  );

 }

 return data;

}


/* =========================
   TOAST
========================= */

function toast(text){

 let el =
  $("toast");

 el.textContent =
  text;

 el.style.position =
  "fixed";

 el.style.top =
  "20px";

 el.style.left =
  "50%";

 el.style.transform =
  "translateX(-50%)";

 el.style.zIndex =
  "1000";

 el.style.padding =
  "12px 17px";

 el.style.borderRadius =
  "14px";

 el.style.background =
  "#fff";

 el.style.color =
  "#080a0d";

 el.style.fontWeight =
  "700";

 el.style.fontSize =
  "13px";

 el.classList.remove(
  "hidden"
 );

 setTimeout(
  () =>
   el.classList.add(
    "hidden"
   ),
  2300
 );

}


/* =========================
   LOGIN
========================= */

async function login(){

 try{

  const data =
   await fetch(
    "/api/login",
    {
     method:"POST",

     headers:{
      "Content-Type":
       "application/json"
     },

     body:JSON.stringify({

      phone:
       $("loginPhone").value,

      pin:
       $("loginPin").value

     })
    }
   ).then(
    r => r.json()
   );

  if(!data.token){

   throw new Error(
    data.detail ||
    "Ошибка входа"
   );

  }

  localStorage.setItem(
   "restaran_token",
   data.token
  );

  localStorage.setItem(
   "restaran_role",
   data.role
  );

  location.reload();

 }
 catch(error){

  toast(
   error.message
  );

 }

}


/* =========================
   LOGOUT
========================= */

function logout(){

 localStorage.clear();

 location.href =
  "/";

}


/* =========================
   BOOT
========================= */

async function boot(){

 if(
  location.pathname ===
  "/admin"
 ){

  await bootAdmin();

  return;

 }

 if(!token){

  return;

 }

 try{

  me =
   await api(
    "/api/me"
   );

  $("loginPage")
   .classList.add(
    "hidden"
   );

  $("app")
   .classList.remove(
    "hidden"
   );

  if(
   me.role ===
   "customer"
  ){

   $("customerApp")
    .classList.remove(
     "hidden"
    );

   await loadCustomer();

  }

  if(
   me.role ===
   "courier"
  ){

   $("courierApp")
    .classList.remove(
     "hidden"
    );

   await loadCourier();

  }

  connectSocket();

 }
 catch{

  localStorage.clear();

 }

}


/* =========================
   CUSTOMER
========================= */

async function loadCustomer(){

 $("customerName")
  .textContent =
  me.user.name;

 await renderCustomerOrders();

}


async function renderCustomerOrders(){

 const data =
  await api(
   "/api/customer/orders"
  );

 if(
  !data.orders.length
 ){

  $("customerOrders")
   .innerHTML = `

    <div class="eyebrow">
     my orders
    </div>

    <h2>
     Пока нет заказов
    </h2>

    <div class="description">
     Новый заказ появится здесь
     после создания администратором.
    </div>

  `;

  return;

 }


 $("customerOrders")
  .innerHTML = `

   <div class="eyebrow">
    my orders
   </div>

   <h2>
    Ваши заказы
   </h2>

   ${data.orders.map(
    order => customerOrderHTML(order)
   ).join("")}

  `;

}


function customerOrderHTML(o){

 const courierButton =
  o.courier_lat &&
  o.courier_lng

  ?

  `
  <button
   class="btn btn-dark"
   onclick="
    showCustomerMap(
     ${o.courier_lat},
     ${o.courier_lng}
    )
   "
  >

   📍 Курьер на карте

  </button>
  `

  :

  "";


 const confirmButton =
  o.status ===
  "delivered"

  ?

  `
  <button
   class="btn btn-green"
   onclick="
    confirmOrder(
     ${o.id}
    )
   "
  >

   ✓ Я получил заказ

  </button>
  `

  :

  "";


 return `

 <div
  class="card"
  style="
   background:#0c1016;
   margin-top:10px;
  "
 >

  <div class="row">

   <div>

    <div
     style="
      font-size:18px;
      font-weight:700;
     "
    >
     Заказ #${o.id}
    </div>

    <div
     class="muted"
     style="margin-top:6px"
    >
     📍 ${escapeHTML(o.address)}
    </div>

    ${
     o.courier_name

     ?

     `
     <div
      class="muted"
      style="margin-top:6px"
     >
      🛵 ${escapeHTML(
       o.courier_name
      )}
     </div>
     `

     :

     ""
    }

   </div>


   <div
    style="
     text-align:right
    "
   >

    <span class="status">
     ${o.status}
    </span>

    <div
     style="
      font-weight:800;
      margin-top:8px
     "
    >
     ${Number(o.total).toFixed(2)}
    </div>

   </div>

  </div>


  <div class="actions">

   ${courierButton}

   ${confirmButton}

  </div>

 </div>

 `;

}


async function confirmOrder(id){

 try{

  await api(
   "/api/customer/orders/" +
   id +
   "/confirm",
   {
    method:"POST"
   }
  );

  toast(
   "Заказ подтверждён"
  );

  await renderCustomerOrders();

 }
 catch(error){

  toast(
   error.message
  );

 }

}


/* =========================
   CUSTOMER MAP
========================= */

function showCustomerMap(
 lat,
 lng
){

 $("customerMapBox")
  .classList.remove(
   "hidden"
  );


 if(!customerMap){

  customerMap =
   L.map(
    "customerMap"
   ).setView(
    [lat,lng],
    15
   );

  L.tileLayer(
   "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
   {
    maxZoom:19
   }
  ).addTo(
   customerMap
  );

  customerMarker =
   L.marker(
    [lat,lng]
   ).addTo(
    customerMap
   );

 }
 else{

  customerMarker
   .setLatLng(
    [lat,lng]
   );

  customerMap
   .setView(
    [lat,lng]
   );

 }

 setTimeout(
  () =>
   customerMap.invalidateSize(),
  150
 );

}


/* =========================
   COURIER
========================= */

async function loadCourier(){

 $("courierName")
  .textContent =
  me.user.name;

 setOnlineButton(
  me.user.online
 );

 await renderCourierOrders();

}


function setOnlineButton(
 online
){

 const btn =
  $("onlineButton");

 if(online){

  btn.textContent =
   "● Онлайн";

  btn.className =
   "btn btn-green";

 }
 else{

  btn.textContent =
   "○ Оффлайн";

  btn.className =
   "btn btn-dark";

 }

}


async function toggleOnline(){

 const online =
  !me.user.online;

 try{

  await api(
   "/api/courier/online",
   {
    method:"POST",

    body:
     JSON.stringify({
      online
     })
   }
  );

  me.user.online =
   online;

  setOnlineButton(
   online
  );

 }
 catch(error){

  toast(
   error.message
  );

 }

}


async function renderCourierOrders(){

 const data =
  await api(
   "/api/courier/orders"
  );


 if(
  !data.orders.length
 ){

  $("courierOrders")
   .innerHTML = `

    <div class="eyebrow">
     deliveries
    </div>

    <h2>
     Нет заказов
    </h2>

    <div class="description">
     Назначенные заказы появятся автоматически.
    </div>

  `;

  return;

 }


 $("courierOrders")
  .innerHTML = `

   <div class="eyebrow">
    deliveries
   </div>

   <h2>
    Ваши заказы
   </h2>

   ${data.orders.map(
    courierOrderHTML
   ).join("")}

  `;

}


function courierOrderHTML(o){

 let action = "";

 if(
  o.status ===
  "assigned"
 ){

  action = `

   <button
    class="btn btn-main"
    onclick="
     courierAction(
      ${o.id},
      'accept'
     )
    "
   >
    Принять заказ
   </button>

  `;

 }

 if(
  o.status ===
  "accepted"
 ){

  action = `

   <button
    class="btn btn-main"
    onclick="
     courierAction(
      ${o.id},
      'start'
     )
    "
   >
    Начать доставку
   </button>

  `;

 }

 if(
  o.status ===
  "delivering"
 ){

  action = `

   <button
    class="btn btn-green"
    onclick="
     courierAction(
      ${o.id},
      'complete'
     )
    "
   >
    ✓ Доставлено
   </button>

  `;

 }


 return `

 <div
  class="card"
  style="
   background:#0c1016;
   margin-top:10px
  "
 >

  <div class="row">

   <div>

    <div
     style="
      font-weight:700;
      font-size:18px
     "
    >
     #${o.id}
     ·
     ${escapeHTML(
      o.customer_name
     )}
    </div>

    <div
     class="muted"
     style="margin-top:6px"
    >
     📍 ${escapeHTML(o.address)}
    </div>

    <div
     class="muted"
     style="margin-top:6px"
    >
     ☎ ${escapeHTML(
      o.customer_phone
     )}
    </div>

   </div>

   <span class="status">
    ${o.status}
   </span>

  </div>

  <div class="actions">

   ${action}

  </div>

 </div>

 `;

}


async function courierAction(
 id,
 action
){

 try{

  await api(
   `/api/courier/orders/${id}/${action}`,
   {
    method:"POST"
   }
  );

  toast(
   "Статус обновлён"
  );

  await renderCourierOrders();

 }
 catch(error){

  toast(
   error.message
  );

 }

/* =========================
   ADMIN MAP
========================= */

function renderAdminMap(
 couriers
){

 const map =
  L.map(
   "adminMap"
  ).setView(
   [40.1772,44.5035],
   12
  );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19
  }
 ).addTo(
  map
 );

 couriers
  .filter(
   c => c.lat && c.lng
  )
  .forEach(
   c => {

    L.marker([
     c.lat,
     c.lng
    ])
    .addTo(map)
    .bindPopup(
     `
      <b>
       ${escapeHTML(c.name)}
      </b>
      <br>
      ${
       c.online
       ?
       "🟢 Онлайн"
       :
       "⚪ Оффлайн"
      }
     `
    );

   }
  );

}

/* =========================
   WEBSOCKET
========================= */

function connectSocket(){

 try{

  socket =
   new WebSocket(
    (
     location.protocol ===
     "https:"
     ?
     "wss://"
     :
     "ws://"
    )
    +
    location.host
    +
    "/ws"
   );


  socket.onopen =
   () =>
    socket.send(
     "connected"
    );


  socket.onmessage =
   async event => {

    const data =
     JSON.parse(
      event.data
     );


    if(
     data.type ===
     "courier_location"
    ){

     if(
      role ===
      "customer"
     ){

      await renderCustomerOrders();

      if(
       data.lat &&
       data.lng
      ){

       showCustomerMap(
        data.lat,
        data.lng
       );

      }

     }

    }


    if(
     data.type ===
     "order_updated" ||
     data.type ===
     "new_order"
    ){

     if(
      role ===
      "customer"
     ){

      await renderCustomerOrders();

     }

     if(
      role ===
      "courier"
     ){

      await renderCourierOrders();

     }

     if(
      role ===
      "admin"
     ){

      await renderStats();

      await adminTab(
       "orders"
      );

     }

    }

   };

 }
 catch{

 }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
 text
){

 return String(
  text ?? ""
 )
 .replace(
  /[&<>"']/g,
  char =>
   ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
   })[char]
 );

}
