<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>

<title>RESTARAN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#08090d;
    --card:rgba(255,255,255,.065);
    --card2:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#9295a3;
    --accent:#ff8a3d;
    --accent2:#ffbd66;
    --green:#4ade80;
    --red:#ff5757;
    --border:rgba(255,255,255,.09);
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(255,138,61,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 20%,
            rgba(255,189,102,.10),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

#app{
    max-width:760px;
    margin:auto;
    padding:18px 15px 100px;
}

.hidden{
    display:none!important;
}

.glass{
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
}

.logoIcon{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    border-radius:15px;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    font-size:23px;
    box-shadow:0 10px 30px rgba(255,138,61,.25);
}

.logoTitle{
    font-size:20px;
    font-weight:900;
}

.logoSub{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
}

.userBadge{
    padding:9px 12px;
    border-radius:14px;
    background:rgba(255,255,255,.07);
    color:#ddd;
    font-size:12px;
}

.hero{
    padding:23px;
    border-radius:28px;
    margin-bottom:15px;
    overflow:hidden;
    position:relative;
}

.hero:after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,138,61,.16);
    right:-60px;
    top:-80px;
    filter:blur(10px);
}

.hero h1{
    margin:0;
    font-size:29px;
    line-height:1.05;
    position:relative;
    z-index:1;
}

.hero p{
    color:var(--muted);
    margin:10px 0 0;
    font-size:13px;
    position:relative;
    z-index:1;
}

.login{
    max-width:430px;
    margin:10vh auto 0;
}

.login .glass{
    padding:24px;
    border-radius:30px;
}

.input{
    width:100%;
    padding:15px 16px;
    margin-top:10px;
    border-radius:16px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.055);
    color:white;
    outline:none;
}

.input:focus{
    border-color:rgba(255,138,61,.7);
    box-shadow:0 0 0 3px rgba(255,138,61,.1);
}

.primary{
    width:100%;
    padding:15px;
    margin-top:13px;
    border-radius:17px;
    color:#15100b;
    font-weight:900;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    box-shadow:0 12px 30px rgba(255,138,61,.2);
    transition:.2s;
}

.primary:active{
    transform:scale(.98);
}

.danger{
    background:rgba(255,87,87,.12);
    color:#ff7777;
    border:1px solid rgba(255,87,87,.2);
}

.success{
    background:rgba(74,222,128,.12);
    color:#6ef29a;
    border:1px solid rgba(74,222,128,.2);
}

.section{
    margin-top:18px;
}

.sectionTitle{
    font-size:18px;
    font-weight:900;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    padding:17px;
    border-radius:21px;
}

.statNum{
    font-size:25px;
    font-weight:950;
}

.statName{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.card{
    padding:17px;
    border-radius:22px;
    margin-bottom:10px;
}

.cardTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cardTitle{
    font-weight:900;
    font-size:16px;
}

.muted{
    color:var(--muted);
    font-size:12px;
}

.price{
    font-weight:950;
    color:#ffd08b;
    white-space:nowrap;
}

.status{
    display:inline-flex;
    margin-top:10px;
    padding:6px 9px;
    border-radius:10px;
    background:rgba(255,255,255,.07);
    font-size:11px;
    font-weight:800;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

.smallBtn{
    flex:1;
    min-width:110px;
    padding:11px 12px;
    border-radius:13px;
    background:rgba(255,255,255,.07);
    color:white;
    border:1px solid var(--border);
    font-size:12px;
    font-weight:800;
}

.smallBtn:active{
    transform:scale(.98);
}

.map{
    margin-top:12px;
    width:100%;
    height:220px;
    border:0;
    border-radius:18px;
    overflow:hidden;
}

.tabs{
    display:flex;
    gap:7px;
    overflow:auto;
    padding:3px;
    margin-bottom:15px;
}

.tab{
    white-space:nowrap;
    padding:11px 14px;
    border-radius:14px;
    background:rgba(255,255,255,.055);
    color:#aaa;
    font-size:12px;
    font-weight:800;
}

.tab.active{
    background:linear-gradient(
        135deg,
        rgba(255,138,61,.25),
        rgba(255,189,102,.12)
    );
    color:#fff;
}

.bottom{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:12px;
    width:min(730px,calc(100% - 24px));
    display:flex;
    gap:6px;
    padding:7px;
    border-radius:20px;
    z-index:50;
}

.nav{
    flex:1;
    padding:11px 5px;
    border-radius:14px;
    color:#9295a3;
    background:transparent;
    font-size:11px;
    font-weight:800;
}

.nav.active{
    color:white;
    background:rgba(255,255,255,.09);
}

.empty{
    text-align:center;
    padding:35px 20px;
    color:var(--muted);
    border-radius:23px;
}

.game{
    min-height:190px;
    padding:22px;
    border-radius:25px;
    margin-bottom:12px;
    position:relative;
    overflow:hidden;
}

.gameIcon{
    font-size:42px;
}

.game h3{
    margin:8px 0 5px;
}

.game p{
    color:var(--muted);
    font-size:12px;
}

.gameBtn{
    padding:11px 14px;
    border-radius:13px;
    background:white;
    color:#111;
    font-weight:900;
}

.memoryBoard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:15px;
}

.memoryCard{
    aspect-ratio:1;
    border-radius:13px;
    background:rgba(255,255,255,.09);
    display:grid;
    place-items:center;
    font-size:23px;
    cursor:pointer;
}

.formGrid{
    display:grid;
    gap:8px;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.notice{
    padding:12px 14px;
    border-radius:15px;
    background:rgba(255,138,61,.08);
    border:1px solid rgba(255,138,61,.12);
    color:#d7d7dc;
    font-size:12px;
    margin-bottom:12px;
}

.loading{
    text-align:center;
    padding:50px 10px;
    color:var(--muted);
}

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%) translateY(15px);
    background:#191a20;
    border:1px solid var(--border);
    padding:12px 17px;
    border-radius:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
    font-size:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:480px){
    #app{
        padding-left:12px;
        padding-right:12px;
    }

    .hero h1{
        font-size:26px;
    }

    .two{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="loginScreen" class="login">
        <div class="glass">
            <div class="logo">
                <div class="logoIcon">🍽</div>
                <div>
                    <div class="logoTitle">RESTARAN</div>
                    <div class="logoSub">Delivery • Food • Games</div>
                </div>
            </div>

            <div style="margin-top:25px">
                <div class="sectionTitle">Вход</div>

                <input
                    id="loginPhone"
                    class="input"
                    placeholder="Номер телефона"
                    inputmode="tel"
                >

                <input
                    id="loginPin"
                    class="input"
                    placeholder="PIN"
                    inputmode="numeric"
                    type="password"
                >

                <button
                    class="primary"
                    onclick="login()"
                >
                    Войти →
                </button>
            </div>
        </div>
    </div>


    <div id="main" class="hidden">

        <div class="top">
            <div class="logo">
                <div class="logoIcon">🍽</div>
                <div>
                    <div class="logoTitle">RESTARAN</div>
                    <div class="logoSub">Ваше приложение</div>
                </div>
            </div>

            <div id="userBadge" class="userBadge">
                —
            </div>
        </div>


        <div id="content"></div>


        <div class="bottom glass">

            <button
                class="nav active"
                data-page="home"
                onclick="showPage('home')"
            >
                🏠<br>Главная
            </button>

            <button
                class="nav"
                data-page="orders"
                onclick="showPage('orders')"
            >
                📦<br>Заказы
            </button>

            <button
                class="nav"
                data-page="games"
                onclick="showPage('games')"
            >
                🎮<br>Игры
            </button>

            <button
                id="adminNav"
                class="nav hidden"
                data-page="admin"
                onclick="showPage('admin')"
            >
                ⚙️<br>Админ
            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>


<script>

const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

let TOKEN = localStorage.getItem("restaran_token") || "";
let ROLE = "";
let USER = null;
let CURRENT_PAGE = "home";


function toast(text){

    const el =
        document.getElementById("toast");

    el.textContent = text;
    el.classList.add("show");

    setTimeout(
        () => el.classList.remove("show"),
        2500
    );
}


async function api(
    url,
    options={}
){

    options.headers = {
        "Content-Type":
            "application/json",
        ...(options.headers || {})
    };

    if(TOKEN){
        options.headers.Authorization =
            "Bearer " + TOKEN;
    }

    const response =
        await fetch(
            url,
            options
        );

    const text =
        await response.text();

    let data = {};

    try{
        data = text
            ? JSON.parse(text)
            : {};
    }catch{
        data = {};
    }

    if(!response.ok){
        throw new Error(
            data.detail ||
            "Ошибка сервера"
        );
    }

    return data;
}


async function login(){

    const phone =
        document.getElementById(
            "loginPhone"
        ).value.trim();

    const pin =
        document.getElementById(
            "loginPin"
        ).value.trim();

    if(!phone || !pin){
        toast("Введите номер и PIN");
        return;
    }

    try{

        const data =
            await api(
                "/api/login",
                {
                    method:"POST",
                    body:JSON.stringify({
                        phone,
                        pin
                    })
                }
            );

        TOKEN = data.token;
        ROLE = data.role;

        localStorage.setItem(
            "restaran_token",
            TOKEN
        );

        await boot();

    }catch(e){
        toast(e.message);
    }
}


async function telegramAdminLogin(){

    if(
        !tg ||
        !tg.initData
    ){
        return false;
    }

    try{

        const response =
            await fetch(
                "/api/admin/web-login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body:
                        new URLSearchParams({
                            init_data:
                                tg.initData
                        })
                }
            );

        if(!response.ok){
            return false;
        }

        const data =
            await response.json();

        TOKEN = data.token;
        ROLE = "admin";

        localStorage.setItem(
            "restaran_token",
            TOKEN
        );

        return true;

    }catch{
        return false;
    }
}


async function boot(){

    if(!TOKEN){

        const adminLogged =
            await telegramAdminLogin();

        if(!adminLogged){
            document
                .getElementById("loginScreen")
                .classList.remove("hidden");

            return;
        }
    }

    try{

        USER =
            await api("/api/me");

        ROLE =
            USER.role;

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("main")
            .classList.remove("hidden");

        document
            .getElementById("userBadge")
            .textContent =
                USER.name;

        if(ROLE === "admin"){

            document
                .getElementById("adminNav")
                .classList.remove("hidden");

        }

        showPage("home");

    }catch{

        TOKEN = "";

        localStorage.removeItem(
            "restaran_token"
        );

        document
            .getElementById("loginScreen")
            .classList.remove("hidden");
    }
}


function setActiveNav(page){

    document
        .querySelectorAll(".nav")
        .forEach(
            btn => {
                btn.classList.toggle(
                    "active",
                    btn.dataset.page === page
                );
            }
        );
}


async function showPage(page){

    CURRENT_PAGE = page;

    setActiveNav(page);

    const content =
        document.getElementById(
            "content"
        );

    content.innerHTML =
        `<div class="loading">Загрузка...</div>`;

    try{

        if(page === "home")
            await renderHome();

        if(page === "orders")
            await renderOrders();

        if(page === "games")
            renderGames();

        if(page === "admin")
            await renderAdmin();

    }catch(e){

        content.innerHTML = `
            <div class="empty glass">
                ❌ Не удалось загрузить данные
                <br><br>
                <small>${e.message}</small>
            </div>
        `;
    }
}


/* =====================================================
   CUSTOMER HOME
===================================================== */

async function renderHome(){

    const content =
        document.getElementById(
            "content"
        );

    if(ROLE === "admin"){

        const stats =
            await api(
                "/api/admin/stats"
            );

        content.innerHTML = `

            <div class="hero glass">
                <h1>
                    Панель управления 👋
                </h1>
                <p>
                    Всё под контролем.
                </p>
            </div>

            <div class="grid">

                <div class="stat glass">
                    <div class="statNum">
                        ${stats.customers}
                    </div>
                    <div class="statName">
                        Клиентов
                    </div>
                </div>

                <div class="stat glass">
                    <div class="statNum">
                        ${stats.couriers}
                    </div>
                    <div class="statName">
                        Курьеров
                    </div>
                </div>

                <div class="stat glass">
                    <div class="statNum">
                        ${stats.orders}
                    </div>
                    <div class="statName">
                        Заказов
                    </div>
                </div>

                <div class="stat glass">
                    <div class="statNum">
                        ${stats.active_orders}
                    </div>
                    <div class="statName">
                        Активных
                    </div>
                </div>

            </div>

            <div class="section">
                <div class="card glass">
                    <div class="cardTitle">
                        💰 Оборот
                    </div>
                    <div style="
                        font-size:30px;
                        font-weight:950;
                        margin-top:8px;
                    ">
                        ${Number(
                            stats.revenue
                        ).toFixed(2)} ₽
                    </div>
                </div>
            </div>
        `;

        return;
    }


    if(ROLE === "courier"){

        const orders =
            await api(
                "/api/courier/orders"
            );

        const active =
            orders.filter(
                o =>
                    ![
                        "closed",
                        "delivered"
                    ].includes(o.status)
            ).length;

        content.innerHTML = `

            <div class="hero glass">
                <h1>
                    Добро пожаловать,
                    ${escapeHtml(USER.name)} 👋
                </h1>

                <p>
                    Активных заказов:
                    <b>${active}</b>
                </p>
            </div>

            <div class="card glass">

                <div class="cardTitle">
                    🚴 Рабочий режим
                </div>

                <p class="muted">
                    Управляйте доступностью
                    курьера в разделе заказов.
                </p>

            </div>
        `;

        return;
    }


    const orders =
        await api(
            "/api/customer/orders"
        );

    const active =
        orders.filter(
            o =>
                ![
                    "closed"
                ].includes(o.status)
        );

    content.innerHTML = `

        <div class="hero glass">
            <h1>
                Привет,
                ${escapeHtml(USER.name)} 👋
            </h1>

            <p>
                Здесь появятся ваши заказы.
            </p>
        </div>

        <div class="section">

            <div class="sectionTitle">
                📦 Активные заказы
            </div>

            ${
                active.length
                ? active.slice(0,3)
                    .map(customerOrderHtml)
                    .join("")
                : `
                    <div class="empty glass">
                        Пока нет активных заказов 🍽
                    </div>
                `
            }

        </div>
    `;
}


/* =====================================================
   ORDERS
===================================================== */

async function renderOrders(){

    const content =
        document.getElementById(
            "content"
        );


    if(ROLE === "customer"){

        const orders =
            await api(
                "/api/customer/orders"
            );

        content.innerHTML = `

            <div class="hero glass">
                <h1>Мои заказы 📦</h1>
                <p>
                    История и текущие доставки
                </p>
            </div>

            ${
                orders.length
                ? orders
                    .map(customerOrderHtml)
                    .join("")
                : `
                    <div class="empty glass">
                        Заказов пока нет
                    </div>
                `
            }
        `;

        return;
    }


    if(ROLE === "courier"){

        const orders =
            await api(
                "/api/courier/orders"
            );

        content.innerHTML = `

            <div class="hero glass">
                <h1>Мои доставки 🚴</h1>
                <p>
                    Управляйте назначенными заказами.
                </p>
            </div>

            <div class="card glass">
                <button
                    class="primary"
                    onclick="toggleOnline()"
                >
                    🟢 Онлайн / Оффлайн
                </button>
            </div>

            ${
                orders.length
                ? orders
                    .map(courierOrderHtml)
                    .join("")
                : `
                    <div class="empty glass">
                        Вам пока ничего не назначено
                    </div>
                `
            }
        `;

        return;
    }


    if(ROLE === "admin"){

        await renderAdminOrders();
    }
}


function customerOrderHtml(o){

    const statuses = {
        new:"🆕 Новый",
        assigned:"👤 Курьер назначен",
        accepted:"✅ Принят",
        delivering:"🚴 Доставляется",
        delivered:"📦 Доставлен",
        closed:"🔒 Закрыт"
    };

    let map = "";

    if(
        o.status === "delivering" &&
        o.courier_lat &&
        o.courier_lon
    ){

        const lat =
            Number(o.courier_lat);

        const lon =
            Number(o.courier_lon);

        const delta = 0.01;

        const bbox =
            `${lon-delta},${lat-delta},${lon+delta},${lat+delta}`;

        map = `
            <iframe
                class="map"
                src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lon}"
            ></iframe>
        `;
    }

    let confirmButton = "";

    if(
        o.status === "delivered" &&
        !o.customer_confirmed
    ){

        confirmButton = `
            <button
                class="smallBtn success"
                onclick="confirmOrder(${o.id})"
            >
                ✅ Подтвердить получение
            </button>
        `;
    }

    return `

        <div class="card glass">

            <div class="cardTop">

                <div>
                    <div class="cardTitle">
                        #${o.id} ·
                        ${escapeHtml(o.title)}
                    </div>

                    <div class="muted">
                        📍 ${escapeHtml(o.address)}
                    </div>
                </div>

                <div class="price">
                    ${Number(o.price).toFixed(0)} ₽
                </div>

            </div>

            <div class="status">
                ${statuses[o.status] || o.status}
            </div>

            ${
                o.courier_name
                ? `
                    <div class="muted"
                         style="margin-top:9px">
                        🚴 Курьер:
                        ${escapeHtml(o.courier_name)}
                    </div>
                `
                : ""
            }

async function assignCourier(orderId){

    try{

        const couriers =
            await api(
                "/api/admin/couriers"
            );

        const available =
            couriers.filter(
                c =>
                    c.approved &&
                    c.active
            );

        if(!available.length){
            toast(
                "Нет доступных курьеров"
            );
            return;
        }

        const list =
            available
            .map(
                c =>
                    `${c.id} — ${c.name}`
            )
            .join("\n");

        const selected =
            prompt(
                "Введите ID курьера:\n\n" +
                list
            );

        if(!selected)
            return;

        await api(
            `/api/admin/orders/${orderId}/assign`,
            {
                method:"POST",
                body:JSON.stringify({
                    courier_id:
                        Number(selected)
                })
            }
        );

        toast(
            "Курьер назначен"
        );

        await renderAdminOrders();

    }catch(e){
        toast(e.message);
    }
}

let memoryFirst = null;
let memoryLock = false;
let memoryPairs = 0;


function startMemory(){

    const board =
        document.getElementById(
            "memory"
        );

    const emojis = [
        "🍕","🍕",
        "🍔","🍔",
        "🍟","🍟",
        "🍣","🍣",
        "🌮","🌮",
        "🍩","🍩",
        "🥤","🥤",
        "🍰","🍰"
    ];

    emojis.sort(
        () => Math.random() - .5
    );

    memoryFirst = null;
    memoryLock = false;
    memoryPairs = 0;

    board.innerHTML =
        emojis.map(
            (emoji,i) => `
                <div
                    class="memoryCard"
                    data-index="${i}"
                    data-value="${emoji}"
                    onclick="memoryClick(this)"
                >
                    ❔
                </div>
            `
        ).join("");
}


function memoryClick(card){

    if(
        memoryLock ||
        card.classList.contains("open")
    ){
        return;
    }

    card.textContent =
        card.dataset.value;

    card.classList.add(
        "open"
    );

    if(!memoryFirst){

        memoryFirst = card;
        return;
    }

    if(
        memoryFirst.dataset.value ===
        card.dataset.value
    ){

        memoryFirst = null;
        memoryPairs++;

        if(memoryPairs === 8){
            toast(
                "🎉 Все пары найдены!"
            );
        }

        return;
    }

    memoryLock = true;

    const first =
        memoryFirst;

    setTimeout(
        () => {

            first.textContent =
                "❔";

            card.textContent =
                "❔";

            first.classList.remove(
                "open"
            );

            card.classList.remove(
                "open"
            );

            memoryFirst = null;
            memoryLock = false;

        },
        650
    );
}


let tapCount = 0;
let tapRunning = false;


function startTapGame(){

    if(tapRunning)
        return;

    tapCount = 0;
    tapRunning = true;

    const el =
        document.getElementById(
            "tapGame"
        );

    el.textContent =
        "Нажимай! 10";

    let seconds = 10;

    el.onclick = () => {

        if(tapRunning){

            tapCount++;

            el.textContent =
                tapCount;
        }
    };

    const timer =
        setInterval(
            () => {

                seconds--;

                if(seconds <= 0){

                    clearInterval(timer);

                    tapRunning = false;

                    el.onclick = null;

                    toast(
                        `🎯 Результат: ${tapCount}`
                    );

                    return;
                }

                el.textContent =
                    `${tapCount} • ${seconds}s`;

            },
            1000
        );
}


function lucky(){

    const prizes = [
        "🍕 Бесплатная пицца!",
        "🍔 Бургер в подарок!",
        "🥤 Бесплатный напиток!",
        "🍟 Картошка фри!",
        "😢 В этот раз мимо!",
        "🔥 JACKPOT!"
    ];

    const result =
        prizes[
            Math.floor(
                Math.random() *
                prizes.length
            )
        ];

    document
        .getElementById(
            "luckyResult"
        )
        .textContent =
            result;
}

===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
