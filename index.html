<style>

body{

.photo{

padding:16px;

}

.header{

display:flex;

}

.headerTitle{

}

.avatar{

height:46px;
border-radius:16px;

place-items:center;
background:rgba(255,255,255,.07);
}

.content{
padding:10px 16px;
}

.card{

border-radius:24px;
border:1px solid rgba(255,255,255,.09);

}

.hero{
min-height:190px;
display:flex;
flex-direction:column;

background:

}

.hero h1{

}

.status{
display:inline-block;
padding:7px 10px;

}

.orderTitle{

}

.row{
display:flex;
justify-content:space-between;
gap:15px;

}

.mapButton{
width:100%;
padding:15px;
border-radius:16px;
background:rgba(118,87,255,.18);
color:#fff;
font-weight:800;
margin-top:12px;
}

#map{
height:420px;
width:100%;
border-radius:20px;
}

.nav{
position:fixed;
z-index:1000;
bottom:12px;
left:50%;
transform:translateX(-50%);
width:calc(100% - 24px);

display:flex;
padding:8px;
border-radius:23px;
background:rgba(15,16,23,.9);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.1);
}

.nav button{
flex:1;
padding:10px 4px;
border-radius:16px;
background:transparent;
color:#8f93a0;
font-size:11px;
}

.nav button.active{
color:white;
background:rgba(118,87,255,.2);
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
padding:17px;
border-radius:20px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
}

.statNumber{
font-size:27px;
font-weight:900;
}

.statLabel{
color:#969aa8;
font-size:12px;
margin-top:5px;
}

.action{
width:100%;
padding:16px;
border-radius:17px;
background:rgba(255,255,255,.06);
color:white;
text-align:left;
margin:5px 0;

}

.danger{

}

#toast{

z-index:99999;
bottom:90px;

transform:translate(-50%,20px);

padding:13px 18px;
border-radius:15px;
background:#191a22;
border:1px solid rgba(255,255,255,.1);
transition:.25s;

}

#toast.show{
opacity:1;

}

</style>

</head>

<body>


<div id="loader">

<div>

<div class="logo">
🍔
</div>

<div class="loaderText">
Загрузка...
</div>

</div>

</div>


<div id="login" class="hidden">

<div class="login">

<div class="photo"></div>

<div class="title">
Добро пожаловать 👋
</div>

<p class="muted">
Введите номер телефона,
который добавил администратор.
</p>

<input
id="phone"
class="input"
placeholder="+374..."
type="tel"
>

<button
class="primary"
onclick="login()"
>
Продолжить
</button>

</div>

</div>


<div id="app" class="hidden">

<header class="header">

<div>

<div
id="hello"
class="headerTitle"
>
Привет 👋
</div>

<div class="muted">
Delivery
</div>

</div>

<div class="avatar">
🍔
</div>

</header>

<main
id="content"
class="content"
></main>

<nav class="nav">

<button
id="navHome"
onclick="home(this)"
class="active"
>
🏠<br>
Главная
</button>

<button
onclick="ordersPage(this)"
>
📦<br>
Заказы
</button>

<button
onclick="mapPage(this)"
>
📍<br>
Карта
</button>

<button
id="adminNav"
class="hidden"
onclick="adminPage(this)"
>
👑<br>
Админ
</button>

</nav>

</div>


<div id="toast"></div>


<script>

const tg =
window.Telegram.WebApp;

tg.ready();
tg.expand();

let me = null;
let socket = null;
let map = null;
let markers = {};
let currentPage = "";


/* =====================================================
API
===================================================== */

async function api(
url,
options={}
){

options.headers = {
...(options.headers || {}),
"X-Telegram-Init-Data":tg.initData
};

const response =
await fetch(url,options);

const data =
await response.json();

if(!response.ok)
throw new Error(
data.error || "Ошибка"
);

return data;
}


/* =====================================================
TOAST
===================================================== */

function toast(text){

const el =
document.getElementById("toast");

el.textContent=text;

el.classList.add("show");

setTimeout(
()=>el.classList.remove("show"),
2500
);
}


/* =====================================================
INIT
===================================================== */

async function init(){

try{

me =
await api("/api/me");

document
.getElementById("loader")
.classList.add("hidden");

if(
me.role==="customer" &&
!me.customer
){

document
.getElementById("login")
.classList.remove("hidden");

return;
}

openApp();

}catch(e){

document
.getElementById("loader")
.classList.add("hidden");

toast(
"Открой приложение через Telegram"
);

}

}


/* =====================================================
OPEN APP
===================================================== */

function openApp(){

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

document
.getElementById("hello")
.textContent =
`Привет, ${me.name || "друг"} 👋`;

if(me.role==="admin"){

document
.getElementById("adminNav")
.classList.remove("hidden");

adminPage();

}else if(
me.role==="courier"
){

courierPage();

}else{

home();

}

connectSocket();

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

const phone =
document
.getElementById("phone")
.value
.trim();

if(!phone){

toast(
"Введите номер телефона"
);

return;
}

try{

await api(
"/api/login",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
phone
})
}
);

me =
await api("/api/me");

openApp();

toast(
"Вход выполнен"
);

}catch(e){

toast(e.message);

}

}


/* =====================================================
HOME
===================================================== */

async function home(button){

if(button)
setActive(button);

currentPage="home";

if(me.role==="courier"){

courierPage(button);
return;

}

if(me.role==="admin"){

adminPage(button);
return;

}

content.innerHTML=`

<div class="card hero">

<h1>
Доставка еды 🍔
</h1>

<p>
Быстро и удобно прямо к тебе.
</p>

</div>

<div id="ordersBox">
Загрузка...
</div>

`;

loadCustomerOrders();

}


/* =====================================================
CUSTOMER ORDERS
===================================================== */

async function loadCustomerOrders(){

try{

const data =
await api("/api/orders");

const box =
document.getElementById(
"ordersBox"
);

if(!data.orders.length){

box.innerHTML=`

<div class="card">

<h2>
Нет активных заказов
</h2>

<p class="muted">
Когда администратор создаст заказ,
он появится здесь.
</p>

</div>

`;

return;

}

box.innerHTML =
data.orders.map(
o=>customerOrderHTML(o)
).join("");

}catch(e){

toast(e.message);

}

}


function customerOrderHTML(o){

let statusText={
new:"Новый заказ",
assigned:"Курьер назначен",
accepted:"Курьер принял заказ",
delivering:"Курьер в пути",
delivered:"Доставлено",
closed:"Закрыт"
}[o.status] || o.status;

return `

<div class="card">

<span class="status">
${escapeHtml(statusText)}
</span>

<div class="orderTitle">
Заказ #${o.id}
</div>

<div class="row">
<span class="muted">
📍 Адрес
</span>
<b>
${escapeHtml(o.address || "—")}
</b>
</div>

<div class="row">
<span class="muted">
🚴 Курьер
</span>
<b>
${escapeHtml(
o.courier_name ||
"Не назначен"
)}
</b>
</div>

${
o.courier_lat &&
o.courier_lon
?
`
<button
class="mapButton"
onclick="mapPage()"
>
📍 Посмотреть геопозицию курьера
</button>
`
:""
}

${
o.status==="delivered"
?
`
<button
class="primary"
onclick="confirmOrder(${o.id})"
>
✅ Подтвердить получение
</button>
`
:""
}

</div>

`;

}


/* =====================================================
CUSTOMER CONFIRM
===================================================== */

async function confirmOrder(id){

try{

await api(
`/api/orders/${id}/confirm`,
{
method:"POST"
}
);

toast(
"Заказ подтверждён ❤️"
);

loadCustomerOrders();

}catch(e){

toast(e.message);

}

}


/* =====================================================
COURIER
===================================================== */

async function courierPage(button){

setActive(button);

currentPage="courier";

content.innerHTML=`

<div class="card hero">

<h1>
Панель курьера 🚴
</h1>

<p>
Управляй своими доставками.
</p>

</div>

<div class="card">

<div class="row">

<span>
Статус
</span>

<b id="onlineText">
${
me.courier?.online
?"🟢 Онлайн"
:"⚫ Оффлайн"
}
</b>

</div>

<button
class="primary"
onclick="toggleOnline()"
>
Изменить статус
</button>

</div>

<div id="courierOrders">
Загрузка...
</div>

<div class="card">

<h3>
📍 Геопозиция
</h3>

<p class="muted">
Отправляй Live Location этому боту.
Координаты будут обновляться автоматически.
</p>

</div>

`;

loadCourierOrders();

}


/* =====================================================
COURIER ONLINE
===================================================== */

async function toggleOnline(){

try{

const online =
!Boolean(
me.courier.online
);

await api(
"/api/courier/online",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
online
})
}
);

me.courier.online=online;

document
.getElementById("onlineText")
.textContent=
online
?"🟢 Онлайн"
:"⚫ Оффлайн";

}catch(e){

toast(e.message);

}

}


/* =====================================================
COURIER ORDERS
===================================================== */

async function loadCourierOrders(){

try{

const data =
await api(
"/api/courier/orders"
);

const box =
document.getElementById(
"courierOrders"
);

if(!box)
return;

if(!data.orders.length){

box.innerHTML=`

<div class="card">

<h3>
📦 Нет заказов
</h3>

<p class="muted">
Новые заказы появятся здесь.
</p>

</div>

`;

return;

}

box.innerHTML =
data.orders.map(
courierOrderHTML
).join("");

}catch(e){

toast(e.message);

}

}


function courierOrderHTML(o){

let status={
new:"Новый",
assigned:"Назначен",
accepted:"Принят",
delivering:"В доставке",
delivered:"Доставлено"
}[o.status] || o.status;

let buttons="";

if(
o.status==="assigned"
){

buttons+=`

<button
class="primary"
onclick="acceptOrder(${o.id})"
>
✅ Принять заказ
</button>

`;

}

if(
o.status==="accepted"
){

buttons+=`

<button
class="primary"
onclick="startDelivery(${o.id})"
>
🚚 Начать доставку
</button>

`;

}

if(
o.status==="delivering"
){

buttons+=`

<button
class="primary"
onclick="completeDelivery(${o.id})"
>
✅ Доставлено
</button>

`;

}

return `

<div class="card">

<span class="status">
${escapeHtml(status)}
</span>

<div class="orderTitle">
Заказ #${o.id}
</div>

<div class="row">

<span class="muted">
👤 Клиент
</span>

<b>
${escapeHtml(
o.customer_name || "—"
)}
</b>

</div>

<div class="row">

<span class="muted">
📞 Телефон
</span>

<b>
${escapeHtml(
o.customer_phone || "—"
)}
</b>

</div>

<div class="row">

<span class="muted">
📍 Адрес
</span>

<b>
${escapeHtml(
o.address || "—"
)}
</b>

</div>

${buttons}

</div>

`;

}


/* =====================================================
COURIER ACTIONS
===================================================== */

async function acceptOrder(id){

try{

await api(
`/api/courier/orders/${id}/accept`,
{
method:"POST"
}
);

toast(
"Заказ принят"
);

loadCourierOrders();

}catch(e){

toast(e.message);

}

}


async function startDelivery(id){

try{

await api(
`/api/courier/orders/${id}/start`,
{
method:"POST"
}
);

toast(
"Доставка начата"
);

loadCourierOrders();

}catch(e){

toast(e.message);

}

}


async function completeDelivery(id){

try{

await api(
`/api/courier/orders/${id}/complete`,
{
method:"POST"
}
);

toast(
"Заказ отмечен доставленным"
);

loadCourierOrders();

}catch(e){

toast(e.message);

}

}


/* =====================================================
MAP
===================================================== */

async function mapPage(button){

setActive(button);

currentPage="map";

content.innerHTML=`

<div class="card">

<h3>
📍 Геопозиция
</h3>

<div id="map"></div>

</div>

`;

map =
L.map("map")
.setView(
[40.1792,44.4991],
13
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

try{

if(me.role==="admin"){

const data =
await api(
"/api/admin/couriers"
);

data.couriers.forEach(
c=>{
if(
c.lat &&
c.lon
){

updateMarker(
c.id,
c.name,
c.lat,
c.lon
);

}
}
);

}else{

const data =
await api("/api/orders");

const order =
data.orders.find(
o=>
o.courier_lat &&
o.courier_lon
);

if(order){

updateMarker(
order.courier_id,
order.courier_name,
order.courier_lat,
order.courier_lon
);

map.setView(
[
order.courier_lat,
order.courier_lon
],
16
);

}

}

}catch(e){

toast(e.message);

}

}


function updateMarker(
id,
name,
lat,
lon
){

if(!map)
return;

if(markers[id]){

markers[id].setLatLng([
lat,
lon
]);

}else{

markers[id]=
L.marker([
lat,
lon
])
.addTo(map)
.bindPopup(
"🚴 "+
escapeHtml(
name || "Курьер"
)
);

}

}


/* =====================================================
ADMIN
===================================================== */

async function adminPage(button){

setActive(button);

currentPage="admin";

content.innerHTML=`

<div class="card hero">

<h1>
Админ-панель 👑
</h1>

<p>
Управление Delivery.
</p>

</div>

<div
id="stats"
class="stats"
>

<div class="stat">
<div class="statNumber">—</div>
<div class="statLabel">Клиенты</div>
</div>

<div class="stat">
<div class="statNumber">—</div>
<div class="statLabel">Курьеры</div>
</div>

<div class="stat">
<div class="statNumber">—</div>
<div class="statLabel">Ожидают</div>
</div>

<div class="stat">
<div class="statNumber">—</div>
<div class="statLabel">Заказы</div>
</div>

</div>

<div class="card">

<button
class="action"
onclick="adminCustomers()"
>
👥 Клиенты
</button>

<button
class="action"
onclick="adminCouriers()"
>
🚴 Курьеры
</button>

<button
class="action"
onclick="createOrderPage()"
>
➕ Создать заказ
</button>

<button
class="action"
onclick="adminOrders()"
>
📦 Все заказы
</button>

<button
class="action"
onclick="mapPage()"
>
🗺️ Карта курьеров
</button>

</div>

`;

try{

const s =
await api(
"/api/admin/stats"
);

const nums =
document.querySelectorAll(
".statNumber"
);

nums[0].textContent=s.customers;
nums[1].textContent=s.couriers;
nums[2].textContent=s.pending_couriers;
nums[3].textContent=s.active_orders;

}catch(e){

toast(e.message);

}

}


/* =====================================================
ADMIN CUSTOMERS
===================================================== */

async function adminCustomers(){

const data =
await api(
"/api/admin/customers"
);

content.innerHTML=`

<div class="card">

<h2>
👥 Клиенты
</h2>

<p class="muted">
Добавь клиента заранее.
После этого он сможет войти
по своему номеру через Telegram.
</p>

<input
id="customerName"
class="input"
placeholder="Имя клиента"
>

<input
id="customerPhone"
class="input"
placeholder="+374..."
>

<button
class="primary"
onclick="createCustomer()"
>
➕ Добавить клиента
</button>

</div>

${
data.customers.map(
c=>`

<div class="card">

<div class="orderTitle">
${escapeHtml(
c.name || "Без имени"
)}
</div>

<div class="muted">
${escapeHtml(c.phone)}
</div>

<div class="muted">
${
c.telegram_id
?"🟢 Telegram привязан"
:"⚪ Не вошёл"
}
</div>

</div>

`
).join("")
}

`;

}


async function createCustomer(){

const name =
document
.getElementById(
"customerName"
)
.value.trim();

const phone =
document
.getElementById(
"customerPhone"
)
.value.trim();

try{

await api(
"/api/admin/customers",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
name,
phone
})
}
);

toast(
"Клиент добавлен"
);

adminCustomers();

}catch(e){

toast(e.message);

}

}


/* =====================================================
ADMIN COURIERS
===================================================== */

async function adminCouriers(){

const data =

async function createOrder(){

const customer =
document
.getElementById(
"orderCustomer"
)
.value;

const courier =
document
.getElementById(
"orderCourier"
)
.value;

const address =
document
.getElementById(
"orderAddress"
)
.value;

const comment =
document
.getElementById(
"orderComment"
)
.value;

if(!customer){

toast(
"Выберите клиента"
);

return;

}

try{

await api(
"/api/admin/orders",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
customer_id:
Number(customer),

courier_id:
courier
?Number(courier)
:null,

address,
comment
})
}
);

toast(
"Заказ создан"
);

adminOrders();

}catch(e){

toast(e.message);

}

}

){

function setActive(button){

document
.querySelectorAll(".nav button")
.forEach(
b=>b.classList.remove("active")
);

if(button)
button.classList.add("active");

}


/* =====================================================
WEBSOCKET
===================================================== */

function connectSocket(){

const protocol =
location.protocol==="https:"
?"wss:"
:"ws:";

socket =
new WebSocket(
`${protocol}//${location.host}/ws`
);

socket.onmessage =
event=>{

const data =
JSON.parse(event.data);

if(
data.type==="courier_location"
){

if(currentPage==="map"){

updateMarker(
data.courier_id,
"",
data.lat,
data.lon
);

}

if(me.role==="customer"){

loadCustomerOrders();

}

}

if(
data.type==="new_order" ||
data.type==="order_update"
){

if(
me.role==="customer" &&
currentPage==="home"
){

loadCustomerOrders();

}

if(
me.role==="courier" &&
currentPage==="courier"
){

loadCourierOrders();

}

if(
me.role==="admin" &&
currentPage==="admin"
){

adminPage();

}

}

};

socket.onclose=()=>{

setTimeout(
connectSocket,
3000
);

};

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}
