<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>RESTARAN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top left,#29231d 0,#12100e 45%,#090909 100%);
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 18px;
}

.hidden {
    display: none !important;
}

.logo {
    font-size: 32px;
    font-weight: 900;
    margin-top: 20px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

.card {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 15px;
    backdrop-filter: blur(20px);
}

.input {
    width: 100%;
    padding: 16px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,.1);
    outline: none;
    background: rgba(255,255,255,.07);
    color: white;
    margin-bottom: 12px;
}

.input::placeholder {
    color: #888;
}

.btn {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 16px;
    background: linear-gradient(135deg,#f5c66d,#ff8b3d);
    color: #111;
    font-weight: 800;
    margin-bottom: 10px;
}

.btn.dark {
    background: rgba(255,255,255,.09);
    color: white;
}

.btn.green {
    background: linear-gradient(135deg,#6ee7a8,#26c281);
}

.btn.red {
    background: linear-gradient(135deg,#ff7777,#e73737);
    color: white;
}

.title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 15px;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
}

.stat {
    background: rgba(255,255,255,.06);
    border-radius: 18px;
    padding: 18px;
}

.stat b {
    display: block;
    font-size: 27px;
    margin-top: 5px;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 6px;
    margin-bottom: 15px;
}

.tab {
    padding: 12px 5px;
    border-radius: 13px;
    border: 0;
    background: rgba(255,255,255,.07);
    color: #aaa;
}

.tab.active {
    background: #fff;
    color: #111;
}

.item {
    padding: 15px;
    border-radius: 17px;
    background: rgba(255,255,255,.055);
    margin-bottom: 10px;
}

.item-title {
    font-weight: 800;
    font-size: 17px;
}

.small {
    color: #999;
    font-size: 13px;
    margin-top: 5px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    margin-top: 8px;
    font-size: 12px;
}

.map {
    height: 260px;
    border-radius: 20px;
    overflow: hidden;
    background: #181818;
}

.order-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.loading {
    text-align: center;
    padding: 50px 0;
    color: #999;
}
</style>
</head>

<body>

<div class="app">

    <!-- LOGIN -->

    <section id="loginPage">

        <div class="logo">🍽 RESTARAN</div>

        <div class="subtitle">
            Система заказов
        </div>

        <div class="card">

            <div class="title">
                Вход
            </div>

            <input
                id="loginPhone"
                class="input"
                placeholder="Номер телефона"
                type="tel"
            >

            <input
                id="loginPin"
                class="input"
                placeholder="PIN"
                type="password"
                inputmode="numeric"
            >

            <button
                class="btn"
                onclick="login()"
            >
                Войти
            </button>

            <div
                id="loginError"
                class="small"
            ></div>

        </div>

    </section>


    <!-- ADMIN -->

    <section id="adminPage" class="hidden">

        <div class="logo">
            RESTARAN
        </div>

        <div class="subtitle">
            Админ-панель
        </div>

        <div class="tabs">

            <button
                class="tab active"
                onclick="adminTab('stats',this)"
            >
                📊
            </button>

            <button
                class="tab"
                onclick="adminTab('orders',this)"
            >
                📦
            </button>

            <button
                class="tab"
                onclick="adminTab('customers',this)"
            >
                👤
            </button>

            <button
                class="tab"
                onclick="adminTab('couriers',this)"
            >
                🚴
            </button>

        </div>


        <!-- STATS -->

        <div id="adminStats">

            <div class="card">

                <div class="title">
                    Статистика
                </div>

                <div class="stat-grid">

                    <div class="stat">
                        Клиенты
                        <b id="statCustomers">0</b>
                    </div>

                    <div class="stat">
                        Курьеры
                        <b id="statCouriers">0</b>
                    </div>

                    <div class="stat">
                        Заказы
                        <b id="statOrders">0</b>
                    </div>

                    <div class="stat">
                        Активные
                        <b id="statActive">0</b>
                    </div>

                </div>

            </div>

        </div>


        <!-- ORDERS -->

        <div id="adminOrders" class="hidden">

            <div class="card">

                <div class="title">
                    Создать заказ
                </div>

                <select
                    id="orderCustomer"
                    class="input"
                ></select>

                <input
                    id="orderTitle"
                    class="input"
                    placeholder="Что заказать?"
                >

                <input
                    id="orderAddress"
                    class="input"
                    placeholder="Адрес доставки"
                >

                <input
                    id="orderPrice"
                    class="input"
                    placeholder="Цена"
                    type="number"
                >

                <button
                    class="btn green"
                    onclick="createOrder()"
                >
                    + Создать заказ
                </button>

            </div>

            <div id="ordersList"></div>

        </div>


        <!-- CUSTOMERS -->

        <div id="adminCustomers" class="hidden">

            <div class="card">

                <div class="title">
                    Новый клиент
                </div>

                <input
                    id="customerName"
                    class="input"
                    placeholder="Имя"
                >

                <input
                    id="customerPhone"
                    class="input"
                    placeholder="Телефон"
                >

                <input
                    id="customerPin"
                    class="input"
                    placeholder="PIN"
                    type="text"
                    inputmode="numeric"
                >

                <button
                    class="btn green"
                    onclick="createCustomer()"
                >
                    + Добавить клиента
                </button>

            </div>

            <div id="customersList"></div>

        </div>


        <!-- COURIERS -->

        <div id="adminCouriers" class="hidden">

            <div class="card">

                <div class="title">
                    Новый курьер
                </div>

                <input
                    id="courierName"
                    class="input"
                    placeholder="Имя"
                >

                <input
                    id="courierPhone"
                    class="input"
                    placeholder="Телефон"
                >

                <input
                    id="courierPin"
                    class="input"
                    placeholder="PIN"
                    type="text"
                    inputmode="numeric"
                >

                <button
                    class="btn green"
                    onclick="createCourier()"
                >
                    + Добавить курьера
                </button>

            </div>

            <div id="couriersList"></div>

        </div>

    </section>


    <!-- CUSTOMER -->

    <section id="customerPage" class="hidden">

        <div class="logo">
            🍽 RESTARAN
        </div>

        <div class="subtitle">
            Мои заказы
        </div>

        <div id="customerOrders"></div>

    </section>


    <!-- COURIER -->

    <section id="courierPage" class="hidden">

        <div class="logo">
            🚴 RESTARAN
        </div>

        <div class="subtitle">
            Кабинет курьера
        </div>

        <div class="card">

            <button
                id="onlineButton"
                class="btn green"
                onclick="toggleOnline()"
            >
                🟢 Выйти на линию
            </button>

        </div>

        <div id="courierOrders"></div>

    </section>

</div>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

let token = localStorage.getItem("restaran_token");
let role = localStorage.getItem("restaran_role");


// =========================================================
// API
// =========================================================

async function api(url, options = {}) {

    options.headers = options.headers || {};

    if (token) {
        options.headers["Authorization"] =
            "Bearer " + token;
    }

    if (
        options.body &&
        typeof options.body !== "string"
    ) {
        options.headers["Content-Type"] =
            "application/json";

        options.body =
            JSON.stringify(options.body);
    }

    const response =
        await fetch(url, options);

    const data =
        await response.json()
        .catch(() => ({}));

    if (!response.ok) {
        throw new Error(
            data.detail || "Ошибка"
        );
    }

    return data;
}


// =========================================================
// SHOW
// =========================================================

function hideAll() {

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("adminPage")
        .classList.add("hidden");

    document
        .getElementById("customerPage")
        .classList.add("hidden");

    document
        .getElementById("courierPage")
        .classList.add("hidden");
}


function showAdmin() {

    hideAll();

    document
        .getElementById("adminPage")
        .classList.remove("hidden");

    loadAdmin();
}


function showCustomer() {

    hideAll();

    document
        .getElementById("customerPage")
        .classList.remove("hidden");

    loadCustomerOrders();
}


function showCourier() {

    hideAll();

    document
        .getElementById("courierPage")
        .classList.remove("hidden");

    loadCourierOrders();
}


function showLogin() {

    hideAll();

    document
        .getElementById("loginPage")
        .classList.remove("hidden");
}


// =========================================================
// ADMIN AUTO LOGIN
// =========================================================

async function tryAdminLogin() {

    if (!tg || !tg.initData) {
        return false;
    }

    try {

        const response =
            await fetch(
                "/api/admin/web-login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        new URLSearchParams({
                            init_data:
                                tg.initData
                        })
                }
            );

        if (!response.ok) {
            return false;
        }

        const data =
            await response.json();

        if (
            data.ok &&
            data.role === "admin"
        ) {

            token = data.token;
            role = "admin";

            localStorage.setItem(
                "restaran_token",
                token
            );

            localStorage.setItem(
                "restaran_role",
                role
            );

            showAdmin();

            return true;
        }

    } catch (error) {

        console.error(
            "Admin login:",
            error
        );
    }

    return false;
}


// =========================================================
// NORMAL LOGIN
// =========================================================

async function login() {

    const phone =
        document
            .getElementById("loginPhone")
            .value
            .trim();

    const pin =
        document
            .getElementById("loginPin")
            .value
            .trim();

    const error =
        document
            .getElementById("loginError");

    error.textContent = "";

    try {

        const data =
            await api(
                "/api/login",
                {
                    method: "POST",
                    body: {
                        phone,
                        pin
                    }
                }
            );

        token = data.token;
        role = data.role;

        localStorage.setItem(
            "restaran_token",
            token
        );

        localStorage.setItem(
            "restaran_role",
            role
        );

        if (role === "customer") {
            showCustomer();
        }

        else if (role === "courier") {
            showCourier();
        }

    } catch (e) {

        error.textContent =
            "❌ " + e.message;
    }
}


// =========================================================
// ADMIN TABS
// =========================================================

function adminTab(tab, button) {

    document
        .querySelectorAll(".tab")
        .forEach(x =>
            x.classList.remove("active")
        );

    button.classList.add("active");

    document
        .getElementById("adminStats")
        .classList.add("hidden");

    document
        .getElementById("adminOrders")
        .classList.add("hidden");

    document
        .getElementById("adminCustomers")
        .classList.add("hidden");

    document
        .getElementById("adminCouriers")
        .classList.add("hidden");

    if (tab === "stats") {

        document
            .getElementById("adminStats")
            .classList.remove("hidden");

        loadStats();
    }

    if (tab === "orders") {

        document
            .getElementById("adminOrders")
            .classList.remove("hidden");

        loadOrders();
        loadCustomersSelect();
    }

    if (tab === "customers") {

        document
            .getElementById("adminCustomers")
            .classList.remove("hidden");

        loadCustomers();
    }

    if (tab === "couriers") {

        document
            .getElementById("adminCouriers")
            .classList.remove("hidden");

        loadCouriers();
    }
}


// =========================================================
// ADMIN LOAD
// =========================================================

async function loadAdmin() {

    await loadStats();
    await loadCustomers();
    await loadCouriers();
    await loadOrders();

    loadCustomersSelect();
}


async function loadStats() {

    try {

        const data =
            await api(
                "/api/admin/stats"
            );

        document
            .getElementById("statCustomers")
            .textContent =
                data.customers;

        document
            .getElementById("statCouriers")
            .textContent =
                data.couriers;

        document
            .getElementById("statOrders")
            .textContent =
                data.orders;

        document
            .getElementById("statActive")
            .textContent =
                data.active_orders;

    } catch (e) {
        console.error(e);
    }
}


// =========================================================
// CUSTOMERS
// =========================================================

async function loadCustomers() {

    const list =
        document.getElementById(
            "customersList"
        );

    try {

        const customers =
            await api(
                "/api/admin/customers"
            );

        list.innerHTML = "";

        if (!customers.length) {

            list.innerHTML =
                '<div class="loading">Клиентов пока нет</div>';

            return;
        }

        customers.forEach(c => {

            const div =
                document.createElement("div");

            div.className = "item";

            div.innerHTML = `
                <div class="item-title">
                    ${escapeHtml(c.name)}
                </div>

                <div class="small">
                    📱 ${escapeHtml(c.phone)}
                </div>

                <div class="badge">
                    ID: ${c.id}
                </div>
            `;

            list.appendChild(div);
        });

    } catch (e) {

        list.innerHTML =
            `<div class="small">❌ ${e.message}</div>`;
    }
}


async function createCustomer() {

    const name =
        document.getElementById(
            "customerName"
        ).value.trim();

    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();

    const pin =
        document.getElementById(
            "customerPin"
        ).value.trim();

    if (!name || !phone || !pin) {
        alert("Заполни все поля");
        return;
    }

    try {

        const data =
            await api(
                "/api/admin/customers",
                {
                    method: "POST",
                    body: {
                        name,
                        phone,
                        pin
                    }
                }
            );

        alert(
            "Клиент создан!\n\n" +
            "Телефон: " + data.phone +
            "\nPIN: " + data.pin
        );

        document.getElementById(
            "customerName"
        ).value = "";

        document.getElementById(
            "customerPhone"
        ).value = "";

        document.getElementById(
            "customerPin"
        ).value = "";

        loadCustomers();
        loadCustomersSelect();
        loadStats();

    } catch (e) {

        alert("❌ " + e.message);
    }
}


// =========================================================
// COURIERS
// =========================================================

async function loadCouriers() {

    const list =
        document.getElementById(
            "couriersList"
        );

    try {

        const couriers =
            await api(
                "/api/admin/couriers"
            );

        list.innerHTML = "";

        if (!couriers.length) {

            list.innerHTML =
                '<div class="loading">Курьеров пока нет</div>';

            return;
        }

        couriers.forEach(c => {

            const div =
                document.createElement("div");

            div.className = "item";

            div.innerHTML = `
                <div class="item-title">
                    ${escapeHtml(c.name)}
                </div>

                <div class="small">
                    📱 ${escapeHtml(c.phone)}
                </div>

                <div class="badge">
                    ${c.approved ? "✅ Подтверждён" : "⏳ Не подтверждён"}
                </div>

                ${
                    !c.approved
                    ? `
                    <button
                        class="btn green"
                        style="margin-top:10px"
                        onclick="verifyCourier(${c.id})"
                    >
                        Подтвердить
                    </button>
                    `
                    : ""
                }
            `;

            list.appendChild(div);
        });

    } catch (e) {

        list.innerHTML =
            `<div class="small">❌ ${e.message}</div>`;
    }
}


async function createCourier() {

    const name =
        document.getElementById(
            "courierName"
        ).value.trim();

    const phone =
        document.getElementById(
            "courierPhone"
        ).value.trim();

    const pin =
        document.getElementById(
            "courierPin"
        ).value.trim();

    if (!name || !phone || !pin) {
        alert("Заполни все поля");
        return;
    }

    try {

        const data =
            await api(
                "/api/admin/couriers",
                {
                    method: "POST",
                    body: {
                        name,
                        phone,
                        pin
                    }
                }
            );

        alert(
            "Курьер создан!\n\n" +
            "Телефон: " + data.phone +
            "\nPIN: " + data.pin
        );

        document.getElementById(
            "courierName"
        ).value = "";

        document.getElementById(
            "courierPhone"
        ).value = "";

        document.getElementById(
            "courierPin"
        ).value = "";

        loadCouriers();
        loadStats();

    } catch (e) {

        alert("❌ " + e.message);
    }
}


async function verifyCourier(id) {

    try {

        await api(
            `/api/admin/couriers/${id}/verify`,
            {
                method: "POST"
            }
        );

        loadCouriers();

    } catch (e) {

        alert("❌ " + e.message);
    }
}


// =========================================================
// ORDERS
// =========================================================

async function loadCustomersSelect() {

    const select =
        document.getElementById(
            "orderCustomer"
        );

    try {

        const customers =
            await api(
                "/api/admin/customers"
            );

        select.innerHTML =
            '<option value="">Выберите клиента</option>';

        customers.forEach(c => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = c.id;

            option.textContent =
                `${c.name} — ${c.phone}`;

            select.appendChild(option);
        });

    } catch (e) {}
}


async function createOrder() {

    const customer_id =
        Number(
            document.getElementById(
                "orderCustomer"
            ).value
        );

    const title =
        document.getElementById(
            "orderTitle"
        ).value.trim();

    const address =
        document.getElementById(
            "orderAddress"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "orderPrice"
            ).value || 0
        );

    if (
        !customer_id ||
        !title ||
        !address
    ) {
        alert("Заполни данные заказа");
        return;
    }

    try {

        await api(
            "/api/admin/orders",
            {
                method: "POST",
                body: {
                    customer_id,
                    title,
                    address,
                    price
                }
            }
        );

        alert("✅ Заказ создан");

        document.getElementById(
            "orderTitle"
        ).value = "";

        document.getElementById(
            "orderAddress"
        ).value = "";

        document.getElementById(
            "orderPrice"
        ).value = "";

        loadOrders();
        loadStats();

    } catch (e) {

        alert("❌ " + e.message);
    }
}


async function loadOrders() {

    const list =
        document.getElementById(
            "ordersList"
        );

    try {

        const orders =
            await api(
                "/api/admin/orders"
            );

        list.innerHTML = "";

        if (!orders.length) {

            list.innerHTML =
                '<div class="loading">Заказов пока нет</div>';

            return;
        }

        orders.forEach(o => {

            const div =
                document.createElement("div");

            div.className = "item";

            div.innerHTML = `
                <div class="item-title">
                    #${o.id} — ${escapeHtml(o.title)}
                </div>

                <div class="small">
                    👤 ${escapeHtml(o.customer_name)}
                </div>

                <div class="small">
                    📍 ${escapeHtml(o.address)}
                </div>

                <div class="small">
                    💰 ${o.price}
                </div>

                <div class="badge">
                    ${escapeHtml(o.status)}
                </div>

                ${
                    o.courier_name
                    ? `
                    <div class="small">
                        🚴 ${escapeHtml(o.courier_name)}
                    </div>
                    `
                    : `
                    <button
                        class="btn"
                        style="margin-top:10px"
                        onclick="assignOrder(${o.id})"
                    >
                        🚴 Назначить курьера
                    </button>
                    `
                }
            `;

            list.appendChild(div);
        });

    } catch (e) {

        list.innerHTML =
            `<div class="small">❌ ${e.message}</div>`;
    }
}


async function assignOrder(orderId) {

    try {

        const couriers =
            await api(
                "/api/admin/couriers"
            );

        const approved =
            couriers.filter(
                c => c.approved
            );

        if (!approved.length) {

            alert(
                "Нет подтверждённых курьеров"
            );

            return;
        }

        let text =
            "Выбери курьера:\n\n";

        approved.forEach((c, i) => {

            text +=
                `${i + 1}. ${c.name} — ${c.phone}\n`;
        });

        const answer =
            prompt(text);

        const index =
            Number(answer) - 1;

        if (
            Number.isNaN(index) ||
            !approved[index]
        ) {
            return;
        }

        await api(
            `/api/admin/orders/${orderId}/assign`,
            {
                method: "POST",
                body: {
                    courier_id:
                        approved[index].id
                }
            }
        );

        loadOrders();

    } catch (e) {

        alert("❌ " + e.message);
    }
}


// =========================================================
// CUSTOMER
// =========================================================

async function loadCustomerOrders() {

    const list =
        document.getElementById(
            "customerOrders"
        );

    try {

        const orders =
            await api(
                "/api/customer/orders"
            );

        list.innerHTML = "";

        if (!orders.length) {

            list.innerHTML = `
                <div class="card">
                    <div class="loading">
                        У вас пока нет заказов
                    </div>
                </div>
            `;

            return;
        }

        orders.forEach(o => {

            const div =
                document.createElement("div");

            div.className = "card";

            let courier =
                "";

            if (
                o.status === "delivering" &&
                o.courier_lat &&
                o.courier_lon
            ) {
                courier = `
                    <div class="map">
                        <iframe
                            style="width:100%;height:100%;border:0"
                            src="https://www.openstreetmap.org/export/embed.html?bbox=${
                                o.courier_lon - 0.01
                            }%2C${
                                o.courier_lat - 0.01
                            }%2C${
                                o.courier_lon + 0.01
                            }%2C${
                                o.courier_lat + 0.01
                            }&marker=${
                                o.courier_lat
                            }%2C${
                                o.courier_lon
                            }">
                        </iframe>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="title">
                    Заказ #${o.id}
                </div>

                <div class="item-title">
                    ${escapeHtml(o.title)}
                </div>

                <div class="small">
                    📍 ${escapeHtml(o.address)}
                </div>

                <div class="badge">
                    ${escapeHtml(o.status)}
                </div>

                ${
                    o.courier_name
                    ? `
                    <div class="small">
                        🚴 Курьер: ${escapeHtml(o.courier_name)}
                    </div>
                    `
                    : ""
                }

                ${
                    courier
                }

                ${
                    o.status === "delivered"
                    ? `
                    <button
                        class="btn green"
                        style="margin-top:10px"
                        onclick="confirmOrder(${o.id})"
                    >
                        ✅ Подтвердить получение
                    </button>
                    `
                    : ""
                }
            `;

            list.appendChild(div);
        });

    } catch (e) {

        list.innerHTML =
            `<div class="small">❌ ${e.message}</div>`;
    }
}


async function confirmOrder(id) {

    try {

        await api(
            `/api/customer/orders/${id}/confirm`,
            {
                method: "POST"
            }
        );

        loadCustomerOrders();

    } catch (e) {

        alert("❌ " + e.message);
    }
}


// =========================================================
// COURIER
// =========================================================

async function loadCourierOrders() {

    const list =
        document.getElementById(
            "courierOrders"
        );

    try {

        const orders =
            await api(
                "/api/courier/orders"
            );

        list.innerHTML = "";

        if (!orders.length) {

            list.innerHTML =
                '<div class="card"><div class="loading">Заказов пока нет</div></div>';

            return;
        }

        orders.forEach(o => {

            const div =
                document.createElement("div");

            div.className = "card";

            let action = "";

            if (o.status === "assigned") {

                action = `
                    <button
                        class="btn"
                        onclick="courierAction(${o.id},'accept')"
                    >
                        ✅ Принять
                    </button>
                `;
            }

            else if (o.status === "accepted") {

                action = `
                    <button
                        class="btn"
                        onclick="courierAction(${o.id},'start')"
                    >
                        🚴 Начать доставку
                    </button>
                `;
            }

            else if (o.status === "delivering") {

                action = `
                    <button
                        class="btn green"
                        onclick="courierAction(${o.id},'complete')"
                    >
                        ✅ Доставлено
                    </button>
                `;
            }

            div.innerHTML = `
                <div class="title">
                    #${o.id}
                </div>

                <div class="item-title">
                    ${escapeHtml(o.title)}
                </div>

                <div class="small">
                    👤 ${escapeHtml(o.customer_name)}
                </div>

                <div class="small">
                    📱 ${escapeHtml(o.customer_phone)}
                </div>

                <div class="small">
                    📍 ${escapeHtml(o.address)}
                </div>

                <div class="badge">
                    ${escapeHtml(o.status)}
                </div>

                <div style="margin-top:10px">
                    ${action}
                </div>
            `;

            list.appendChild(div);
        });

    } catch (e) {

        list.innerHTML =
            `<div class="small">❌ ${e.message}</div>`;
    }
}


async function courierAction(id, action) {

    try {

        await api(
            `/api/courier/orders/${id}/${action}`,
            {
                method: "POST"
            }
        );

        loadCourierOrders();

    } catch (e) {

        alert("❌ " + e.message);
    }
}


async function toggleOnline() {

    try {

        const data =
            await api(
                "/api/courier/online",
                {
                    method: "POST"
                }
            );

        const button =
            document.getElementById(
                "onlineButton"
            );

        if (data.online) {

            button.textContent =
                "🔴 Выйти с линии";

            button.className =
                "btn red";

        } else {

            button.textContent =
                "🟢 Выйти на линию";

            button.className =
                "btn green";
        }

    } catch (e) {

        alert("❌ " + e.message);
    }
}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


// =========================================================
// START
// =========================================================

async function startApp() {

    // 1. Сначала пробуем автоматически
    //    авторизовать Telegram-админа
    const adminLogged =
        await tryAdminLogin();

    if (adminLogged) {
        return;
    }

    // 2. Если уже есть обычная сессия
    if (token) {

        try {

            const me =
                await api("/api/me");

            role = me.role;

            if (role === "customer") {
                showCustomer();
                return;
            }

            if (role === "courier") {
                showCourier();
                return;
            }

            if (role === "admin") {
                showAdmin();
                return;
            }

        } catch (e) {

            localStorage.removeItem(
                "restaran_token"
            );

            localStorage.removeItem(
                "restaran_role"
            );

            token = null;
            role = null;
        }
    }

    // 3. Обычный клиент/курьер
    showLogin();
}


startApp();
