<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RESTARAN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#08090d;
    --card:rgba(255,255,255,.065);
    --border:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#999daa;
    --orange:#ff8b3d;
    --yellow:#ffc36a;
    --green:#49df80;
    --red:#ff5959;
}

body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 0%,rgba(255,139,61,.17),transparent 35%),
        radial-gradient(circle at 100% 20%,rgba(255,195,106,.08),transparent 35%),
        var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
    font:inherit;
}

button{
    border:0;
}

#app{
    width:min(760px,100%);
    margin:auto;
    padding:15px 13px 105px;
}

.hidden{
    display:none!important;
}

.glass{
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:0 18px 55px rgba(0,0,0,.25);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logoIcon{
    width:44px;
    height:44px;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-size:23px;
    background:linear-gradient(135deg,var(--orange),var(--yellow));
}

.logoTitle{
    font-weight:950;
    font-size:20px;
}

.logoSub{
    color:var(--muted);
    font-size:11px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.userBadge{
    padding:9px 12px;
    border-radius:13px;
    background:rgba(255,255,255,.07);
    font-size:11px;
}

.hero{
    padding:23px;
    border-radius:27px;
    margin-bottom:12px;
}

.hero h1{
    margin:0;
    font-size:27px;
    line-height:1.05;
}

.hero p{
    color:var(--muted);
    font-size:13px;
    margin:10px 0 0;
}

.login{
    max-width:430px;
    margin:12vh auto 0;
}

.loginBox{
    padding:25px;
    border-radius:30px;
}

.title{
    font-size:20px;
    font-weight:950;
    margin-bottom:13px;
}

.input{
    width:100%;
    padding:15px;
    border-radius:16px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.055);
    color:white;
    outline:none;
    margin-top:8px;
}

.input:focus{
    border-color:rgba(255,139,61,.7);
    box-shadow:0 0 0 3px rgba(255,139,61,.1);
}

.primary{
    width:100%;
    margin-top:10px;
    padding:15px;
    border-radius:16px;
    color:#15100b;
    font-weight:950;
    background:linear-gradient(135deg,var(--orange),var(--yellow));
}

.section{
    margin-top:16px;
}

.sectionTitle{
    font-weight:950;
    font-size:18px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.stat{
    padding:17px;
    border-radius:20px;
}

.statNum{
    font-size:26px;
    font-weight:950;
}

.statName{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.card{
    padding:16px;
    border-radius:21px;
    margin-bottom:9px;
}

.cardTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cardTitle{
    font-weight:900;
}

.muted{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.price{
    color:#ffd28d;
    font-weight:950;
    white-space:nowrap;
}

.status{
    display:inline-block;
    padding:6px 9px;
    margin-top:9px;
    border-radius:9px;
    background:rgba(255,255,255,.07);
    font-size:11px;
    font-weight:800;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:11px;
}

.smallBtn{
    flex:1;
    min-width:105px;
    padding:11px;
    border-radius:13px;
    color:white;
    background:rgba(255,255,255,.075);
    border:1px solid var(--border);
    font-size:12px;
    font-weight:850;
}

.success{
    color:#70ef9b;
    background:rgba(73,223,128,.1);
}

.danger{
    color:#ff7777;
    background:rgba(255,89,89,.1);
}

.notice{
    padding:12px;
    border-radius:14px;
    background:rgba(255,139,61,.08);
    color:#d2d3d8;
    font-size:12px;
    margin-bottom:10px;
}

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:4px;
}

.tab{
    white-space:nowrap;
    padding:10px 13px;
    border-radius:13px;
    color:#aaa;
    background:rgba(255,255,255,.055);
    font-size:12px;
    font-weight:850;
}

.tab.active{
    color:white;
    background:rgba(255,139,61,.2);
}

.empty{
    padding:35px 15px;
    text-align:center;
    color:var(--muted);
    border-radius:21px;
}

.bottom{
    position:fixed;
    left:50%;
    bottom:11px;
    transform:translateX(-50%);
    width:min(735px,calc(100% - 22px));
    display:flex;
    gap:5px;
    padding:6px;
    border-radius:20px;
    z-index:50;
}

.nav{
    flex:1;
    padding:10px 4px;
    border-radius:14px;
    color:#888b98;
    background:transparent;
    font-size:10px;
    font-weight:850;
}

.nav.active{
    color:white;
    background:rgba(255,255,255,.09);
}

.loading{
    text-align:center;
    padding:50px;
    color:var(--muted);
}

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    z-index:100;
    max-width:90%;
    padding:12px 16px;
    border-radius:14px;
    background:#191a20;
    border:1px solid var(--border);
    font-size:12px;
    text-align:center;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.formGrid{
    display:grid;
    gap:8px;
}

.map{
    width:100%;
    height:210px;
    border:0;
    border-radius:17px;
    margin-top:10px;
}

.game{
    padding:20px;
    border-radius:23px;
    margin-bottom:10px;
}

.game h3{
    margin:8px 0 5px;
}

.game p{
    color:var(--muted);
    font-size:12px;
}

.gameBtn{
    padding:11px 15px;
    border-radius:13px;
    background:white;
    color:#111;
    font-weight:900;
}

.memory{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-top:12px;
}

.memoryCard{
    aspect-ratio:1;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    font-size:22px;
}

@media(max-width:480px){
    .hero h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="loginScreen" class="login">
    <div class="glass loginBox">

        <div class="logo">
            <div class="logoIcon">🍽</div>
            <div>
                <div class="logoTitle">RESTARAN</div>
                <div class="logoSub">Food • Delivery • Games</div>
            </div>
        </div>

        <div style="margin-top:25px">
            <div class="title">Вход в приложение</div>

            <input
                id="loginPhone"
                class="input"
                type="tel"
                inputmode="tel"
                placeholder="Номер телефона"
            >

            <input
                id="loginPin"
                class="input"
                type="password"
                inputmode="numeric"
                placeholder="PIN"
            >

            <button
                class="primary"
                onclick="login()"
            >
                Войти →
            </button>
        </div>

    </div>
</div>


<div id="main" class="hidden">

    <div class="top">

        <div class="logo">
            <div class="logoIcon">🍽</div>

            <div>
                <div class="logoTitle">
                    RESTARAN
                </div>

                <div class="logoSub">
                    Ваш ресторан
                </div>
            </div>
        </div>

        <div
            id="userBadge"
            class="userBadge"
        >
            —
        </div>

    </div>

    <div id="content"></div>

    <div class="bottom glass">

        <button
            class="nav active"
            data-page="home"
            onclick="showPage('home')"
        >
            🏠<br>Главная
        </button>

        <button
            class="nav"
            data-page="orders"
            onclick="showPage('orders')"
        >
            📦<br>Заказы
        </button>

        <button
            class="nav"
            data-page="games"
            onclick="showPage('games')"
        >
            🎮<br>Игры
        </button>

        <button
            id="adminNav"
            class="nav hidden"
            data-page="admin"
            onclick="showPage('admin')"
        >
            ⚙️<br>Админ
        </button>

    </div>

</div>

</div>

<div id="toast" class="toast"></div>


<script>

const tg =
    window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

let TOKEN =
    localStorage.getItem(
        "restaran_token"
    ) || "";

let ROLE = "";
let USER = null;


/* ================= ERROR FIX ================= */

function readableError(error){

    if(error === null ||
       error === undefined){
        return "Неизвестная ошибка";
    }

    if(typeof error === "string"){
        return error;
    }

    if(Array.isArray(error)){

        return error
            .map(item => {

                if(typeof item === "string"){
                    return item;
                }

                if(item?.msg){
                    return item.msg;
                }

                return JSON.stringify(item);

            })
            .join(", ");
    }

    if(typeof error === "object"){

        if(error.msg){
            return error.msg;
        }

        if(error.message){
            return error.message;
        }

        if(error.detail){

            return readableError(
                error.detail
            );
        }

        try{
            return JSON.stringify(error);
        }catch{
            return "Ошибка сервера";
        }
    }

    return String(error);
}


function toast(text){

    const el =
        document.getElementById(
            "toast"
        );

    el.textContent =
        readableError(text);

    el.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => el.classList.remove("show"),
            3000
        );
}


/* ================= API ================= */

async function api(
    url,
    options={}
){

    const headers = {
        ...(options.headers || {})
    };

    if(
        options.body &&
        typeof options.body === "string"
    ){
        headers["Content-Type"] =
            headers["Content-Type"] ||
            "application/json";
    }

    if(TOKEN){
        headers.Authorization =
            "Bearer " + TOKEN;
    }

    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );

    const text =
        await response.text();

    let data = null;

    try{
        data =
            text
            ? JSON.parse(text)
            : {};
    }catch{
        data = {
            detail:text
        };
    }

    if(!response.ok){

        throw new Error(
            readableError(
                data?.detail ?? data
            )
        );
    }

    return data;
}


/* ================= LOGIN ================= */

async function login(){

    const phone =
        document.getElementById(
            "loginPhone"
        ).value.trim();

    const pin =
        document.getElementById(
            "loginPin"
        ).value.trim();

    if(!phone || !pin){
        toast(
            "Введите номер телефона и PIN"
        );
        return;
    }

    try{

        const data =
            await api(
                "/api/login",
                {
                    method:"POST",
                    body:JSON.stringify({
                        phone,
                        pin
                    })
                }
            );

        TOKEN = data.token;
        ROLE = data.role;

        localStorage.setItem(
            "restaran_token",
            TOKEN
        );

        await boot();

    }catch(e){

        toast(e.message);
    }
}


async function adminTelegramLogin(){

    if(
        !tg ||
        !tg.initData
    ){
        return false;
    }

    try{

        const response =
            await fetch(
                "/api/admin/web-login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body:
                        new URLSearchParams({
                            init_data:
                                tg.initData
                        })
                }
            );

        if(!response.ok){
            return false;
        }

        const data =
            await response.json();

        TOKEN = data.token;
        ROLE = "admin";

        localStorage.setItem(
            "restaran_token",
            TOKEN
        );

        return true;

    }catch{
        return false;
    }
}


async function boot(){

    if(!TOKEN){

        const ok =
            await adminTelegramLogin();

        if(!ok){

            document
                .getElementById(
                    "loginScreen"
                )
                .classList.remove(
                    "hidden"
                );

            return;
        }
    }

    try{

        USER =
            await api("/api/me");

        ROLE =
            USER.role;

        document
            .getElementById(
                "loginScreen"
            )
            .classList.add(
                "hidden"
            );

        document
            .getElementById(
                "main"
            )
            .classList.remove(
                "hidden"
            );

        document
            .getElementById(
                "userBadge"
            )
            .textContent =
                USER.name;

        if(ROLE === "admin"){

            document
                .getElementById(
                    "adminNav"
                )
                .classList.remove(
                    "hidden"
                );
        }

        showPage("home");

    }catch(e){

        TOKEN = "";

        localStorage.removeItem(
            "restaran_token"
        );

        document
            .getElementById(
                "loginScreen"
            )
            .classList.remove(
                "hidden"
            );

        toast(
            readableError(e)
        );
    }
}


/* ================= NAV ================= */

function setActive(page){

    document
        .querySelectorAll(".nav")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page === page
                );
            }
        );
}


async function showPage(page){

    setActive(page);

    const content =
        document.getElementById(
            "content"
        );

    content.innerHTML =
        `<div class="loading">Загрузка...</div>`;

    try{

        if(page === "home"){
            await home();
        }

        if(page === "orders"){
            await ordersPage();
        }

        if(page === "games"){
            gamesPage();
        }

        if(page === "admin"){
            await adminPage();
        }

    }catch(e){

        content.innerHTML = `
            <div class="empty glass">
                ❌ ${escapeHtml(
                    readableError(e)
                )}
            </div>
        `;
    }
}


/* ================= HOME ================= */

async function home(){

    const content =
        document.getElementById(
            "content"
        );

    if(ROLE === "admin"){

        const s =
            await api(
                "/api/admin/stats"
            );

        content.innerHTML = `

            <div class="hero glass">
                <h1>
                    RESTARAN Control ⚡
                </h1>

                <p>
                    Добро пожаловать,
                    администратор.
                </p>
            </div>

            <div class="grid">

                <div class="stat glass">
                    <div class="statNum">
                        ${s.customers}
                    </div>
                    <div class="statName">
                        Клиенты
                    </div>
                </div>

                <div class="stat glass">
                    <div class="statNum">
                        ${s.couriers}
                    </div>
                    <div class="statName">
                        Сотрудники
                    </div>
                </div>

                <div class="stat glass">
                    <div class="statNum">
                        ${s.orders}
                    </div>
                    <div class="statName">
                        Заказы
                    </div>
                </div>

                <div class="stat glass">
                    <div class="statNum">
                        ${s.active_orders}
                    </div>
                    <div class="statName">
                        Активные
                    </div>
                </div>

            </div>

            <div class="card glass section">

                <div class="muted">
                    Оборот
                </div>

                <div style="
                    font-size:30px;
                    font-weight:950;
                    margin-top:5px
                ">
                    ${Number(
                        s.revenue
                    ).toFixed(2)} ₽
                </div>

            </div>
        `;

        return;
    }


    if(ROLE === "courier"){

        const list =
            await api(
                "/api/courier/orders"
            );

        content.innerHTML = `

            <div class="hero glass">
                <h1>
                    Привет,
                    ${escapeHtml(USER.name)} 👋
                </h1>

                <p>
                    Управляйте своими доставками
                    в разделе заказов.
                </p>
            </div>

            <div class="card glass">

                <div class="cardTitle">
                    🚴 Курьер
                </div>

                <div class="muted">
                    Заказов:
                    ${list.length}
                </div>

            </div>
        `;

        return;
    }


    const list =
        await api(
            "/api/customer/orders"
        );

    const active =
        list.filter(
            x => x.status !== "closed"
        );

    content.innerHTML = `

        <div class="hero glass">
            <h1>
                Привет,
                ${escapeHtml(USER.name)} 👋
            </h1>

            <p>
                Добро пожаловать в RESTARAN.
            </p>
        </div>

        <div class="sectionTitle">
            📦 Активные заказы
        </div>

        ${
            active.length
            ? active
                .slice(0,3)
                .map(customerOrder)
                .join("")
            : `
                <div class="empty glass">
                    Пока нет активных заказов 🍽
                </div>
            `
        }
    `;
}


/* ================= ORDERS ================= */

async function ordersPage(){

    if(ROLE === "customer"){

        const list =
            await api(
                "/api/customer/orders"
            );

        document
            .getElementById(
                "content"
            )
            .innerHTML = `

            <div class="hero glass">
                <h1>Мои заказы 📦</h1>
                <p>
                    Все ваши заказы
                </p>
            </div>

            ${
                list.length
                ? list.map(customerOrder).join("")
                : `
                    <div class="empty glass">
                        Заказов пока нет
                    </div>
                `
            }
        `;

        return;
    }


    if(ROLE === "courier"){

        const list =
            await api(
                "/api/courier/orders"
            );

        document
            .getElementById(
                "content"
            )
            .innerHTML = `

            <div class="hero glass">
                <h1>Мои доставки 🚴</h1>
                <p>
                    Управление заказами
                </p>
            </div>

            <div class="card glass">
                <button
                    class="primary"
                    onclick="toggleOnline()"
                >
                    🟢 Изменить онлайн-статус
                </button>
            </div>

            ${
                list.length
                ? list.map(courierOrder).join("")
                : `
                    <div class="empty glass">
                        Заказов нет
                    </div>
                `
            }
        `;

        return;
    }

    await adminOrders();
}


/* ================= CUSTOMER ORDER ================= */

function customerOrder(o){

    const status = {
        new:"🆕 Новый",
        assigned:"👤 Курьер назначен",
        accepted:"✅ Принят",
        delivering:"🚴 Доставляется",
        delivered:"📦 Доставлен",
        closed:"🔒 Закрыт"
    }[o.status] || o.status;

    let map = "";

    if(
        o.status === "delivering" &&
        o.courier_lat &&
        o.courier_lon
    ){

        const lat =
            Number(o.courier_lat);

        const lon =
            Number(o.courier_lon);

        const d = .01;

        map = `
            <iframe
                class="map"
                src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-d},${lat-d},${lon+d},${lat+d}&layer=mapnik&marker=${lat},${lon}"
            ></iframe>
        `;
    }

    return `

        <div class="card glass">

            <div class="cardTop">

                <div>

                    <div class="cardTitle">
                        #${o.id}
                        ·
                        ${escapeHtml(o.title)}
                    </div>

                    <div class="muted">
                        📍
                        ${escapeHtml(o.address)}
                    </div>

                    ${
                        o.courier_name
                        ? `
                            <div class="muted">
                                🚴
                                ${escapeHtml(
                                    o.courier_name
                                )}
                            </div>
                        `
                        : ""
                    }

                </div>

                <div class="price">
                    ${Number(o.price).toFixed(0)} ₽
                </div>

            </div>

            <div class="status">
                ${status}
            </div>

            ${map}

            ${
                o.status === "delivered" &&
                !o.customer_confirmed
                ? `
                    <div class="actions">
                        <button
                            class="smallBtn success"
                            onclick="confirmOrder(${o.id})"
                        >
                            ✅ Подтвердить получение
                        </button>
                    </div>
                `
                : ""
            }

        </div>
    `;
}


/* ================= COURIER ORDER ================= */

function courierOrder(o){

    let buttons = "";

    if(o.status === "assigned"){

        buttons += `
            <button
                class="smallBtn success"
                onclick="courierAction(
                    ${o.id},
                    'accept'
                )"
            >
                ✅ Принять
            </button>
        `;
    }

    if(o.status === "accepted"){

        buttons += `
            <button
                class="smallBtn"

/*
    ГЛАВНОЕ ИСПРАВЛЕНИЕ:

    orderPhone -> телефон клиента

    Сервер сам находит:
    users.phone
    -> users.id
    -> orders.customer_id
*/

async function createOrder(){

    try{

        const phone =
            document.getElementById(
                "orderPhone"
            ).value.trim();

        const title =
            document.getElementById(
                "orderTitle"
            ).value.trim();

        const address =
            document.getElementById(
                "orderAddress"
            ).value.trim();

        const priceValue =
            document.getElementById(
                "orderPrice"
            ).value.trim();

        const price =
            priceValue
            ? Number(priceValue)
            : 0;

        if(!phone){
            toast(
                "Введите номер телефона клиента"
            );
            return;
        }

        if(!title){
            toast(
                "Введите название заказа"
            );
            return;
        }

        if(!address){
            toast(
                "Введите адрес доставки"
            );
            return;
        }

        if(
            Number.isNaN(price) ||
            price < 0
        ){
            toast(
                "Введите правильную цену"
            );
            return;
        }

        const result =
            await api(
                "/api/admin/orders",
                {
                    method:"POST",
                    body:JSON.stringify({
                        phone:phone,
                        title:title,
                        address:address,
                        price:price
                    })
                }
            );

        toast(
            `✅ Заказ #${result.id} создан`
        );

        await adminTab("orders");

    }catch(e){

        /*
            Здесь больше не будет
            [object Object].
        */

        toast(
            readableError(e)
        );
    }
}

async function assignCourier(orderId){

    try{

        const list =
            await api(
                "/api/admin/couriers"
            );

        const available =
            list.filter(
                x =>
                    x.approved &&
                    x.active
            );

        if(!available.length){

            toast(
                "Нет доступных курьеров"
            );

            return;
        }

        const text =
            available
            .map(
                x =>
                    `${x.id} — ${x.name}`
            )
            .join("\n");

        const value =
            prompt(
                "Введите ID курьера:\n\n" +
                text
            );

        if(!value)
            return;

        const id =
            Number(value);

        if(!Number.isInteger(id)){
            toast(
                "Неверный ID курьера"
            );
            return;
        }

        await api(
            `/api/admin/orders/${orderId}/assign`,
            {
                method:"POST",
                body:JSON.stringify({
                    courier_id:id
                })
            }
        );

        toast(
            "🚴 Курьер назначен"
        );

        await adminOrders();

    }catch(e){
        toast(e.message);
    }
}

let firstMemory = null;
let memoryLock = false;
let pairs = 0;


function startMemory(){

    const board =
        document.getElementById(
            "memory"
        );

    const arr = [
        "🍕","🍕",
        "🍔","🍔",
        "🍟","🍟",
        "🍣","🍣",
        "🌮","🌮",
        "🍩","🍩",
        "🥤","🥤",
        "🍰","🍰"
    ];

    arr.sort(
        () => Math.random()-.5
    );

    firstMemory = null;
    memoryLock = false;
    pairs = 0;

    board.innerHTML =
        arr.map(
            (emoji,i) => `
                <div
                    class="memoryCard"
                    data-value="${emoji}"
                    onclick="memoryClick(this)"
                >
                    ❔
                </div>
            `
        ).join("");
}


function memoryClick(card){

    if(
        memoryLock ||
        card.classList.contains("open")
    ){
        return;
    }

    card.textContent =
        card.dataset.value;

    card.classList.add(
        "open"
    );

    if(!firstMemory){

        firstMemory = card;
        return;
    }

    if(
        firstMemory.dataset.value ===
        card.dataset.value
    ){

        firstMemory = null;
        pairs++;

        if(pairs === 8){
            toast(
                "🎉 Все пары найдены!"
            );
        }

        return;
    }

    memoryLock = true;

    const first =
        firstMemory;

    setTimeout(
        () => {

            first.textContent = "❔";
            card.textContent = "❔";

            first.classList.remove("open");
            card.classList.remove("open");

            firstMemory = null;
            memoryLock = false;

        },
        650
    );
}


let tapRunning = false;
let tapCount = 0;


function startTap(){

    if(tapRunning)
        return;

    tapRunning = true;
    tapCount = 0;

    const el =
        document.getElementById(
            "tap"
        );

    let seconds = 10;

    el.textContent =
        "0 • 10";

    el.onclick = () => {

        if(tapRunning){

            tapCount++;

            el.textContent =
                `${tapCount} • ${seconds}`;
        }
    };

    const timer =
        setInterval(
            () => {

                seconds--;

                if(seconds <= 0){

                    clearInterval(timer);

                    tapRunning = false;
                    el.onclick = null;

                    toast(
                        `🎯 Результат: ${tapCount}`
                    );

                    return;
                }

                el.textContent =
                    `${tapCount} • ${seconds}`;

            },
            1000
        );
}

}


/* ================= ESCAPE ================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
