<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RESTARAN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#08090d;
 color:#fff;
 font-family:Inter,Arial,sans-serif;
 min-height:100vh;
}
button,input{
 font:inherit;
}
button{
 border:0;
 cursor:pointer;
}
#app{
 max-width:650px;
 margin:auto;
 min-height:100vh;
 padding:18px;
}
.card{
 background:#11131a;
 border:1px solid #252936;
 border-radius:20px;
 padding:16px;
 margin-bottom:12px;
 box-shadow:0 12px 40px #0005;
}
h1,h2,h3,p{margin-top:0}
input{
 width:100%;
 background:#0b0d12;
 color:#fff;
 border:1px solid #292d38;
 border-radius:14px;
 padding:14px;
 outline:none;
 margin:6px 0;
}
input:focus{
 border-color:#6d72ff;
}
.btn{
 width:100%;
 padding:14px;
 border-radius:14px;
 background:#6366f1;
 color:#fff;
 font-weight:700;
 margin-top:8px;
}
.btn.red{background:#dc3545}
.btn.green{background:#19a974}
.btn.gray{background:#252936}
.row{
 display:flex;
 gap:8px;
}
.row>*{flex:1}
.hidden{display:none!important}
.title{
 font-size:28px;
 font-weight:900;
 margin-bottom:18px;
}
.small{
 color:#9ca3af;
 font-size:13px;
}
.stat{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.statBox{
 background:#181b24;
 border-radius:16px;
 padding:15px;
}
.statBox b{
 display:block;
 font-size:25px;
 margin-top:5px;
}
.tabs{
 display:flex;
 gap:6px;
 overflow:auto;
 margin-bottom:12px;
}
.tab{
 white-space:nowrap;
 background:#181b24;
 color:#aaa;
 padding:11px 14px;
 border-radius:12px;
}
.tab.active{
 background:#6366f1;
 color:#fff;
}
.item{
 background:#181b24;
 border-radius:16px;
 padding:14px;
 margin:8px 0;
}
.item b{
 font-size:16px;
}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:9px;
 background:#292d3a;
 font-size:12px;
 margin-top:6px;
}
.pin{
 color:#8bffbd;
 font-weight:900;
 letter-spacing:2px;
}
#fatal{
 position:fixed;
 inset:0;
 background:#08090d;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px;
 text-align:center;
 z-index:9999;
}
</style>
</head>
<body>

<div id="fatal" class="hidden">
 <div class="card">
  <h2>Ошибка доступа</h2>
  <p id="fatalText"></p>
 </div>
</div>

<div id="app"></div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){
 tg.ready();
 tg.expand();
}

const ADMIN_IDS = new Set(["8357023784","7003441441"]);
let token = localStorage.getItem("restaran_token");
let me = null;

const app = document.getElementById("app");

function formatError(x){
 if(!x) return "Неизвестная ошибка";
 if(typeof x === "string") return x;
 if(x.detail) return typeof x.detail === "string" ? x.detail : JSON.stringify(x.detail);
 if(x.message) return x.message;
 try{return JSON.stringify(x)}catch{return String(x)}
}

function fatal(text){
 document.getElementById("fatalText").textContent = formatError(text);
 document.getElementById("fatal").classList.remove("hidden");
}

async function api(url, options={}){
 options.headers = options.headers || {};
 options.headers["Content-Type"] = "application/json";

 if(token){
  options.headers["Authorization"] = "Bearer " + token;
 }

 const r = await fetch(url,options);
 let data = {};
 try{data = await r.json()}catch{}

 if(!r.ok){
  throw new Error(formatError(data));
 }

 return data;
}

function logout(){
 localStorage.removeItem("restaran_token");
 token=null;
 location.reload();
}

function loginScreen(){
 app.innerHTML = `
 <div style="padding-top:60px">
  <div class="title">🍽 RESTARAN</div>
  <div class="card">
   <h2>Вход</h2>
   <input id="loginPhone" placeholder="Телефон">
   <input id="loginPin" placeholder="PIN" type="password" inputmode="numeric">
   <button class="btn" onclick="doLogin()">Войти</button>
  </div>
 </div>`;
}

async function doLogin(){
 try{
  const phone=document.getElementById("loginPhone").value;
  const pin=document.getElementById("loginPin").value;

  const x=await api("/api/login",{
   method:"POST",
   body:JSON.stringify({phone,pin})
  });

  token=x.token;
  localStorage.setItem("restaran_token",token);
  await boot();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function adminTelegramLogin(){
 const tgId=String(tg?.initDataUnsafe?.user?.id || "");

 if(!ADMIN_IDS.has(tgId)) return false;

 if(!tg?.initData){
  fatal("Откройте RESTARAN через Telegram.");
  return true;
 }

 try{
  const x=await api("/api/admin/web-login",{
   method:"POST",
   body:JSON.stringify({init_data:tg.initData})
  });

  token=x.token;
  localStorage.setItem("restaran_token",token);
  return true;
 }catch(e){
  localStorage.removeItem("restaran_token");
  token=null;
  fatal("Не удалось подтвердить администратора:\n"+formatError(e.message));
  return true;
 }
}

async function boot(){
 const tgId=String(tg?.initDataUnsafe?.user?.id || "");

 if(ADMIN_IDS.has(tgId)){
  const handled=await adminTelegramLogin();
  if(handled){
   if(!token)return;
  }
 }else if(!token){
  loginScreen();
  return;
 }

 try{
  me=await api("/api/me");

  if(me.role==="admin"){
   renderAdmin();
  }else if(me.role==="customer"){
   renderCustomer();
  }else if(me.role==="courier"){
   renderCourier();
  }else{
   logout();
  }
 }catch(e){
  localStorage.removeItem("restaran_token");
  token=null;

  if(ADMIN_IDS.has(tgId)){
   fatal(formatError(e.message));
  }else{
   loginScreen();
  }
 }
}

async function renderAdmin(){
 app.innerHTML=`
 <div class="title">🍽 RESTARAN</div>

 <div class="card">
  <div class="row">
   <div>
    <div class="small">Администратор</div>
    <b>${escapeHtml(me.name)}</b>
   </div>
   <button class="btn gray" onclick="logout()">Выйти</button>
  </div>
 </div>

 <div id="stats"></div>

 <div class="tabs">
  <button class="tab active" onclick="adminTab('orders',this)">Заказы</button>
  <button class="tab" onclick="adminTab('customers',this)">Клиенты</button>
  <button class="tab" onclick="adminTab('couriers',this)">Курьеры</button>
 </div>

 <div id="adminContent"></div>
 `;

 await loadStats();
 adminTab("orders",document.querySelector(".tab"));
}

function adminTab(type,el){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 if(el)el.classList.add("active");

 if(type==="orders")loadAdminOrders();
 if(type==="customers")loadCustomers();
 if(type==="couriers")loadCouriers();
}

async function loadStats(){
 try{
  const s=await api("/api/admin/stats");

  document.getElementById("stats").innerHTML=`
  <div class="card">
   <div class="stat">
    <div class="statBox">Клиенты<b>${s.customers}</b></div>
    <div class="statBox">Курьеры<b>${s.couriers}</b></div>
    <div class="statBox">Заказы<b>${s.orders}</b></div>
    <div class="statBox">Выручка<b>${Number(s.revenue).toFixed(2)}</b></div>
   </div>
  </div>`;
 }catch(e){}
}

async function loadAdminOrders(){
 const box=document.getElementById("adminContent");

 try{
  const [orders,couriers]=await Promise.all([
   api("/api/admin/orders"),
   api("/api/admin/couriers")
  ]);

  box.innerHTML=`
  <div class="card">
   <h3>Создать заказ</h3>
   <input id="oPhone" placeholder="Телефон клиента">
   <input id="oTitle" placeholder="Название заказа">
   <input id="oAddress" placeholder="Адрес">
   <input id="oPrice" placeholder="Цена" type="number">
   <button class="btn green" onclick="createOrder()">Создать заказ</button>
  </div>

  <div class="card">
   <h3>Заказы</h3>
   <div id="adminOrdersArea"></div>
  </div>`;

  const area=document.getElementById("adminOrdersArea");

  if(!orders.length){
   area.innerHTML='<div class="small">Заказов нет</div>';
   return;
  }

  area.innerHTML=orders.map(o=>`
   <div class="item">
    <b>#${o.id} — ${escapeHtml(o.title)}</b>
    <div class="small">Клиент: ${escapeHtml(o.customer_name)} · ${escapeHtml(o.customer_phone)}</div>
    <div class="small">📍 ${escapeHtml(o.address)}</div>
    <div>${Number(o.price).toFixed(2)}</div>
    <span class="badge">${escapeHtml(o.status)}</span>

    ${o.courier_name
      ? `<div class="small">Курьер: ${escapeHtml(o.courier_name)}</div>`
      : `
      <select id="courier_${o.id}" style="width:100%;margin-top:8px;background:#0b0d12;color:#fff;border:1px solid #292d38;border-radius:12px;padding:12px">
       <option value="">Выберите курьера</option>
       ${couriers.filter(c=>c.active&&c.approved).map(c=>
        `<option value="${c.id}">${escapeHtml(c.name)} · ${c.online?"онлайн":"оффлайн"}</option>`
       ).join("")}
      </select>
      <button class="btn" onclick="assignOrder(${o.id})">Назначить</button>
      `
    }

    ${o.status!=="closed"
      ? `<button class="btn red" onclick="closeOrder(${o.id})">Закрыть заказ</button>`
      : ""}
   </div>
  `).join("");
 }catch(e){
  box.innerHTML=`<div class="card">${escapeHtml(formatError(e.message))}</div>`;
 }
}

async function createOrder(){
 try{
  await api("/api/admin/orders",{
   method:"POST",
   body:JSON.stringify({
    phone:document.getElementById("oPhone").value,
    title:document.getElementById("oTitle").value,
    address:document.getElementById("oAddress").value,
    price:Number(document.getElementById("oPrice").value||0)
   })
  });

  await loadStats();
  await loadAdminOrders();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function assignOrder(id){
 try{
  const courier=document.getElementById("courier_"+id).value;

  if(!courier){
   alert("Выберите курьера");
   return;
  }

  await api("/api/admin/orders/"+id+"/assign",{
   method:"POST",
   body:JSON.stringify({courier_id:Number(courier)})
  });

  await loadAdminOrders();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function closeOrder(id){
 if(!confirm("Закрыть заказ?"))return;

 try{
  await api("/api/admin/orders/"+id+"/close",{method:"POST"});
  await loadStats();
  await loadAdminOrders();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function loadCustomers(){
 const box=document.getElementById("adminContent");

 try{
  const users=await api("/api/admin/customers");

  box.innerHTML=`
  <div class="card">
   <h3>Новый клиент</h3>
   <input id="cName" placeholder="Имя клиента">
   <input id="cPhone" placeholder="Телефон">
   <input id="cPin" placeholder="PIN клиента" inputmode="numeric">
   <div class="small">PIN задаёте вы сами. Он будет отображаться в списке клиентов.</div>
   <button class="btn green" onclick="createCustomer()">Создать клиента</button>
  </div>

  <div class="card">
   <h3>Клиенты</h3>
   <div id="adminCustomersArea"></div>
  </div>`;

  const area=document.getElementById("adminCustomersArea");

  area.innerHTML=users.length ? users.map(u=>`
   <div class="item">
    <b>${escapeHtml(u.name)}</b>
    <div class="small">📱 ${escapeHtml(u.phone)}</div>
    <div>PIN: <span class="pin">${escapeHtml(u.pin_plain||"—")}</span></div>
    <span class="badge">${u.active?"Активен":"Удалён"}</span>
    ${u.active
      ? `<button class="btn red" onclick="deleteCustomer(${u.id})">🗑 Удалить аккаунт</button>`
      : ""}
   </div>
  `).join("") : '<div class="small">Клиентов нет</div>';

 }catch(e){
  box.innerHTML=`<div class="card">${escapeHtml(formatError(e.message))}</div>`;
 }
}

async function createCustomer(){
 try{
  const name=document.getElementById("cName").value.trim();
  const phone=document.getElementById("cPhone").value.trim();
  const pin=document.getElementById("cPin").value.trim();

  if(!name||!phone||!pin){
   alert("Заполните имя, телефон и PIN");
   return;
  }

  await api("/api/admin/customers",{
   method:"POST",
   body:JSON.stringify({name,phone,pin})
  });

  await loadStats();
  await loadCustomers();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function deleteCustomer(id){
 if(!confirm("Удалить аккаунт клиента?"))return;

 try{
  await api("/api/admin/customers/"+id,{method:"DELETE"});
  await loadStats();
  await loadCustomers();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function loadCouriers(){
 const box=document.getElementById("adminContent");

 try{
  const couriers=await api("/api/admin/couriers");

  box.innerHTML=`
  <div class="card">
   <h3>Новый курьер</h3>
   <input id="crName" placeholder="Имя курьера">
   <input id="crPhone" placeholder="Телефон">
   <input id="crPin" placeholder="PIN курьера" inputmode="numeric">
   <button class="btn green" onclick="createCourier()">Создать курьера</button>
  </div>

  <div class="card">
   <h3>Курьеры</h3>
   <div id="adminCouriersArea"></div>
  </div>`;

  const area=document.getElementById("adminCouriersArea");

  area.innerHTML=couriers.length ? couriers.map(c=>`
   <div class="item">
    <b>${escapeHtml(c.name)}</b>
    <div class="small">📱 ${escapeHtml(c.phone)}</div>
    <div>PIN: <span class="pin">${escapeHtml(c.pin_plain||"—")}</span></div>
    <div>
     <span class="badge">${c.approved?"Одобрен":"Ожидает"}</span>
     <span class="badge">${c.online?"Онлайн":"Оффлайн"}</span>
     <span class="badge">${c.active?"Активен":"Уволен"}</span>
    </div>

    ${c.active&&!c.approved
      ? `<button class="btn green" onclick="approveCourier(${c.id})">Одобрить</button>`
      : ""}

    ${c.active
      ? `<button class="btn red" onclick="fireCourier(${c.id})">Уволить</button>`
      : ""}
   </div>
  `).join("") : '<div class="small">Курьеров нет</div>';

 }catch(e){
  box.innerHTML=`<div class="card">${escapeHtml(formatError(e.message))}</div>`;
 }
}

async function createCourier(){
 try{
  await api("/api/admin/couriers",{
   method:"POST",
   body:JSON.stringify({
    name:document.getElementById("crName").value,
    phone:document.getElementById("crPhone").value,
    pin:document.getElementById("crPin").value
   })
  });

  await loadStats();
  await loadCouriers();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function approveCourier(id){
 try{
  await api("/api/admin/couriers/"+id+"/approve",{method:"POST"});
  await loadStats();
  await loadCouriers();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function fireCourier(id){
 if(!confirm("Уволить курьера?"))return;

 try{
  await api("/api/admin/couriers/"+id+"/fire",{method:"POST"});
  await loadStats();
  await loadCouriers();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function renderCustomer(){
 app.innerHTML=`
 <div class="title">🍽 RESTARAN</div>

 <div class="card">
  <div class="small">Клиент</div>
  <h2>${escapeHtml(me.name)}</h2>
  <div>📱 ${escapeHtml(me.phone)}</div>
  <button class="btn gray" onclick="logout()">Выйти</button>
 </div>

 <div class="card">
  <h3>Мои заказы</h3>
  <div id="customerOrders"></div>
 </div>`;

 await loadCustomerOrders();
}

async function loadCustomerOrders(){
 try{
  const orders=await api("/api/customer/orders");
  const area=document.getElementById("customerOrders");

  if(!orders.length){
   area.innerHTML='<div class="small">Заказов нет</div>';
   return;
  }

  area.innerHTML=orders.map(o=>`
   <div class="item">
    <b>#${o.id} — ${escapeHtml(o.title)}</b>
    <div class="small">📍 ${escapeHtml(o.address)}</div>
    <div>💰 ${Number(o.price).toFixed(2)}</div>
    <span class="badge">${escapeHtml(o.status)}</span>

    ${o.status==="delivered"
      ? `<button class="btn green" onclick="confirmOrder(${o.id})">Получил заказ</button>`
      : ""}

    ${o.status==="delivering"&&o.courier_lat&&o.courier_lon
      ? `<div class="small" style="margin-top:8px">
          📍 Курьер: ${o.courier_lat}, ${o.courier_lon}
         </div>`
      : ""}
   </div>
  `).join("");
 }catch(e){}
}

async function confirmOrder(id){
 try{
  await api("/api/customer/orders/"+id+"/confirm",{method:"POST"});
  await loadCustomerOrders();
 }catch(e){
  alert(formatError(e.message));
 }
}

async function renderCourier(){
 app.innerHTML=`
 <div class="title">🚴 RESTARAN</div>

 <div class="card">
  <div class="small">Курьер</div>
  <h2>${escapeHtml(me.name)}</h2>
  <div>📱 ${escapeHtml(me.phone)}</div>

  <button id="onlineBtn" class="btn green" onclick="toggleOnline()">
   Онлайн
  </button>

  <button class="btn gray" onclick="sendLocation()">📍 Отправить геолокацию</button>
  <button class="btn gray" onclick="logout()">Выйти</button>
 </div>

 <div class="card">
  <h3>Мои заказы</h3>
  <div id="courierOrders"></div>
 </div>`;

 await loadCourierOrders();
}

let courierOnline=false;

async function toggleOnline(){
 courierOnline=!courierOnline;

 try{
  await api("/api/courier/online",{
   method:"POST",
   body:JSON.stringify({online:courierOnline})
  });

  document.getElementById("onlineBtn").textContent=
   courierOnline?"Оффлайн":"Онлайн";

 }catch(e){
  courierOnline=!courierOnline;
 }
}

async function sendLocation(){
 if(!navigator.geolocation){
  alert("Геолокация недоступна");
  return;
 }

 navigator.geolocation.getCurrentPosition(async pos=>{
  try{
   await api("/api/courier/location",{
    method:"POST",
    body:JSON.stringify({
     lat:pos.coords.latitude,
     lon:pos.coords.longitude
    })
   });

   alert("Геолокация отправлена");
  }catch(e){
   alert(formatError(e.message));
  }
 },()=>alert("Разрешите доступ к геолокации"));
}

async function loadCourierOrders(){
 try{
  const orders=await api("/api/courier/orders");
  const area=document.getElementById("courierOrders");

  if(!orders.length){
   area.innerHTML='<div class="small">Заказов нет</div>';
   return;
  }

  area.innerHTML=orders.map(o=>`
   <div class="item">
    <b>#${o.id} — ${escapeHtml(o.title)}</b>
    <div class="small">👤 ${escapeHtml(o.customer_name)}</div>
    <div class="small">📱 ${escapeHtml(o.customer_phone)}</div>
    <div class="small">📍 ${escapeHtml(o.address)}</div>
    <div>💰 ${Number(o.price).toFixed(2)}</div>
    <span class="badge">${escapeHtml(o.status)}</span>

    ${o.status==="assigned"
      ? `<button class="btn green" onclick="courierAction(${o.id},'accept')">Принять</button>`
      : ""}

    ${o.status==="accepted"
      ? `<button class="btn green" onclick="courierAction(${o.id},'start')">Начать доставку</button>`
      : ""}

    ${o.status==="delivering"
      ? `<button class="btn green" onclick="courierAction(${o.id},'complete')">Доставлено</button>`
      : ""}
   </div>
  `).join("");
 }catch(e){}
}

async function courierAction(id,action){
 try{
  await api("/api/courier/orders/"+id+"/"+action,{method:"POST"});
  await loadCourierOrders();
 }catch(e){
  alert(formatError(e.message));
 }
}

function escapeHtml(value){
 return String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

boot();

setInterval(async()=>{
 if(!token||!me)return;

 try{
  if(me.role==="admin"){
   await loadStats();
   const active=document.querySelector(".tab.active");
   if(active){
    if(active.textContent.includes("Заказы"))await loadAdminOrders();
    if(active.textContent.includes("Клиенты"))await loadCustomers();
    if(active.textContent.includes("Курьеры"))await loadCouriers();
   }
  }

  if(me.role==="customer")await loadCustomerOrders();
  if(me.role==="courier")await loadCourierOrders();
 }catch{}
},10000);
</script>

</body>
  </html>
